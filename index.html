<script type="module">
const canvas = document.querySelector('#scene');
const ctx = canvas.getContext('2d', { alpha: false });
const giftStage = document.querySelector('#stage-gifts');
const stageStatus = document.querySelector('#mode').lastChild;
const albumDialog = document.querySelector('#album');
const reducedSceneMotion = matchMedia('(prefers-reduced-motion: reduce)');
const tau = Math.PI * 2;
const formationTime = 2.7;
const treeHeight = 5.2;
const treeRadius = 1.56;
const cameraDistance = 11;
const cameraTilt = .21;
const tiltCos = Math.cos(cameraTilt);
const tiltSin = Math.sin(cameraTilt);
const maxParticles = 4300;
const palettes = {
  pine: ['#3a9c67', '#69df95', '#b7fcc3', '#ffe7a0', '#85c58e', '#fff3d5'],
  frost: ['#427eb3', '#67c4f2', '#c1f5ff', '#e8eaff', '#7dbddd', '#f5fcff'],
  rose: ['#a44470', '#f579a9', '#ffc0d9', '#ffe5ad', '#e68fbd', '#fff2e2'],
};
const introPalette = ['#c6a266', '#e8bf76', '#ffe6aa', '#fff0c9', '#dbb679', '#fff9de'];
const giftModels = Array.from({ length: 25 }, (_, index) => {
  const angle = index * 2.39996;
  const distance = 1.56 + (index * 7 % 11) * .053;
  return {
    x: Math.cos(angle) * distance, z: Math.sin(angle) * distance,
    size: .22 + (index * 13 % 19) * .014, angle: angle * .63,
    paper: index * 7 % 5, lid: 0,
  };
});
const stageGifts = giftModels.map((_, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'stage-gift';
  button.setAttribute('aria-label', '打开树下第 ' + (index + 1) + ' 个礼盒');
  button.setAttribute('aria-haspopup', 'dialog');
  giftStage.append(button);
  return button;
});
const effects = { scattered: false, density: 3000, palette: 'pine', color: '#8fe8af', shape: 'glow', gift: 'classic', energy: 0, scenery: 'forest', orbit: 0 };
let width, height, center, ground, radius, worldScale, mobile;
let spread = 0;
const random = (max = 1) => Math.random() * max;
const mix = (a, b, t) => a + (b - a) * t;
function smoothProgress(value) {
  const t = Math.max(0, Math.min(1, value));
  return t * t * (3 - 2 * t);
}
const particles = Array.from({ length: maxParticles }, (_, i) => {
  const level = random() ** .79;
  const angle = random(tau);
  const distance = treeRadius * level ** .88 * (.55 + random(.47));
  return {
    level, x: Math.cos(angle) * distance, z: Math.sin(angle) * distance,
    angle: random(tau), galaxy: .45 + random(1.95), height: random(4),
    size: .35 + random(1.15), phase: random(tau), color: Math.floor(random(6)), light: i % 58 === 0,
  };
});
const stars = Array.from({length: 195}, () => [random(), random(), random(1.5) + .25, random()]);
const snow = Array.from({length: 82}, () => [random(), random(), random(1.7) + .3, random()]);
const winterThemes = {
  forest: [['#06132d','#203f73','#122848'], ['#1c3864','#09152d'], '#101c36', '#fff0c9'],
  cabin: [['#110e27','#563b61','#2e294a'], ['#314264','#11182e'], '#20233e', '#ffe4ae'],
  aurora: [['#060e28','#163f57','#212e55'], ['#1e3d62','#0b1933'], '#111c38', '#e1eee7'],
  dawn: [['#222648','#b47788','#696d9a'], ['#4b5d87','#142840'], '#374361', '#fff0c6'],
};
const backdrop = document.createElement('canvas');
const backdropCtx = backdrop.getContext('2d', { alpha: false });
let introFinished = false;
let visible = true, frame = 0, lastFrame = 0, elapsed = 0;
let particleBudget = 1200, samples = 0, averageCost = 0, averageStep = 0;
let backdropTheme, memoryNodes = [], orbitAngle = 0, autoAngle = 0;
const frameArt = new WeakMap();

function setMemoryNodes(nodes) {
  memoryNodes = nodes;
  for (const node of nodes) {
    const image = node.querySelector('img');
    if (image) {
      frameArt.set(node, image);
    } else {
      const texture = document.createElement('canvas');
      texture.width = texture.height = 96;
      const paint = texture.getContext('2d');
      paint.font = '61px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      paint.textAlign = 'center';
      paint.textBaseline = 'middle';
      paint.fillStyle = '#503445';
      paint.fillText(node.textContent, 48, 52, 87);
      frameArt.set(node, texture);
    }
  }
  invalidateScene();
}

function resize() {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  const wasMobile = mobile;
  width = bounds.width;
  height = bounds.height;
  mobile = width < 600;
  const ratio = Math.min(window.devicePixelRatio || 1, mobile ? 1.25 : 1.6, Math.sqrt(1200000 / (width * height)));
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  if (mobile !== wasMobile) {
    particleBudget = mobile ? 1550 : 2600;
    samples = averageCost = averageStep = 0;
  }
  center = width * (mobile ? .51 : .535);
  ground = height * (mobile ? .74 : .765);
  worldScale = Math.min(height * (mobile ? .45 : .55) / treeHeight, width / 5.6);
  radius = worldScale * 2.3;
  drawBackdrop();
  invalidateScene();
}

function drawBackdrop() {
  backdrop.width = canvas.width;
  backdrop.height = canvas.height;
  backdropCtx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
  backdropTheme = effects.scenery;
  drawWinterLandscape(backdropCtx);
  for (const [x, y, size, brightness] of stars) {
    backdropCtx.globalAlpha = .17 + .61 * brightness;
    backdropCtx.fillStyle = size > 1.35 ? '#f5dcaa' : '#c5ddff';
    backdropCtx.fillRect(x * width, y * height * .54, size, size);
  }
  const floor = backdropCtx.createRadialGradient(center, ground + 4, 0, center, ground + 4, radius * 1.15);
  floor.addColorStop(0, '#6f8bc385');
  floor.addColorStop(1, '#6f8bc300');
  backdropCtx.globalAlpha = .73;
  backdropCtx.fillStyle = floor;
  backdropCtx.fillRect(0, 0, width, height);
  backdropCtx.globalAlpha = 1;
}

function drawWinterLandscape(paint) {
  const [[zenith, horizon, lowerSky], [snowLight, snowDark], mountains, moonColor] = winterThemes[effects.scenery] || winterThemes.forest;
  const ridge = height * .49;
  const sky = paint.createLinearGradient(0, 0, 0, ridge * 1.16);
  sky.addColorStop(0, zenith);
  sky.addColorStop(.79, horizon);
  sky.addColorStop(1, lowerSky);
  paint.fillStyle = sky;
  paint.fillRect(0, 0, width, height);

  if (effects.scenery === 'aurora') {
    for (let band = 0; band < 5; band++) {
      paint.beginPath();
      paint.moveTo(width * -.05, ridge * (.52 + band * .035));
      paint.bezierCurveTo(width * .23, ridge * .02, width * .62, ridge * (.82 + band * .018), width * 1.04, ridge * .04);
      paint.globalAlpha = .21 - band * .027;
      paint.strokeStyle = band % 2 ? '#70e3c7' : '#97c1ee';
      paint.lineWidth = 2 + band * 9;
      paint.stroke();
    }
    paint.globalAlpha = 1;
  }

  const moonX = width * (mobile ? .81 : .77);
  const moonY = height * (mobile ? .24 : .19);
  const moonSize = Math.max(12,Math.min(29,height * .036));
  const moonGlow = paint.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonSize * 4);
  moonGlow.addColorStop(0, '#ffebbcaa');
  moonGlow.addColorStop(.32, '#c5d7ff54');
  moonGlow.addColorStop(1, '#b7c9ff00');
  paint.fillStyle = moonGlow;
  paint.fillRect(moonX - moonSize * 4, moonY - moonSize * 4, moonSize * 8, moonSize * 8);
  paint.fillStyle = moonColor;
  paint.beginPath();
  paint.arc(moonX, moonY, moonSize * .74, 0, tau);
  paint.fill();

  paint.fillStyle = mountains;
  paint.beginPath();
  paint.moveTo(0, height);
  for (let i = 0; i <= 34; i++) {
    const x = i / 34;
    const y = ridge + Math.sin(x * 14 + 2) * height * .039 - Math.abs(Math.sin(x * 29 + .7)) * height * .053;
    paint.lineTo(x * width, y);
  }
  paint.lineTo(width, height);
  paint.fill();
  const snowGround = paint.createLinearGradient(0, ridge * .97, 0, height);
  snowGround.addColorStop(0, snowDark);
  snowGround.addColorStop(.36, snowLight);
  snowGround.addColorStop(1, snowDark);
  paint.fillStyle = snowGround;
  paint.beginPath();
  paint.moveTo(0, ridge);
  paint.bezierCurveTo(width * .24, ridge * .87, width * .42, ridge * 1.16, width * .65, ridge);
  paint.bezierCurveTo(width * .82, ridge * .85, width * .97, ridge * 1.03, width, ridge);
  paint.lineTo(width, height);
  paint.lineTo(0, height);
  paint.fill();

  for (let bank = 0; bank < 20; bank++) {
    const x = ((bank * .273 + .16) % 1) * width;
    const y = ridge + (((bank * .79 + .13) % 1) * .43) * height;
    const size = height * (.014 + ((bank * .153) % 1) * .042);
    paint.save();
    paint.translate(x, y);
    paint.scale(1, .23);
    const reflection = paint.createRadialGradient(0, 0, 0, 0, 0, size);
    reflection.addColorStop(0, '#b9d6ff48');
    reflection.addColorStop(1, '#b9d6ff00');
    paint.fillStyle = reflection;
    paint.fillRect(-size, -size, 2 * size, 2 * size);
    paint.restore();
  }
  for (let i = 0; i < 30; i++) {
    const x = ((i * .197 + .025) % 1);
    const depth = (i * .381) % 1;
    if (x > .35 && x < .68 && depth > .14) continue;
    const size = height * (.028 + depth * .122);
    const foot = ridge + height * (.001 + depth * .27);
    drawPine(paint, x * width, foot, size, depth);
  }
  if (effects.scenery === 'cabin') drawCabin(paint, width * (mobile ? .13 : .24), ridge + height * .21, height * (mobile ? .088 : .129));
}

function drawPine(paint, x, foot, size, depth) {
  const shade = depth > .55 ? '#081326' : '#11223c';
  const shadowWidth = size * .51;
  paint.globalAlpha = .24 + depth * .30;
  paint.fillStyle = '#071124';
  paint.beginPath();
  paint.ellipse(x + size * .12, foot, shadowWidth, size * .085, 0, 0, tau);
  paint.fill();
  paint.globalAlpha = 1;
  for (let layer = 2; layer >= 0; layer--) {
    const peak = foot - size + layer * size * .21;
    const bottom = peak + size * (.43 + layer * .035);
    const half = size * (.12 + layer * .082);
    paint.fillStyle = shade;
    paint.beginPath();
    paint.moveTo(x, peak);
    paint.lineTo(x + half * .87, bottom - size * .036);
    paint.lineTo(x + half, bottom);
    paint.quadraticCurveTo(x + half * .17, bottom + size * .062, x - half, bottom);
    paint.lineTo(x - half * .83, bottom - size * .052);
    paint.closePath();
    paint.fill();
    paint.strokeStyle = '#9eb8dc55';
    paint.lineWidth = Math.max(1, size * .025);
    paint.beginPath();
    paint.moveTo(x - half * .81, bottom - size * .046);
    paint.quadraticCurveTo(x - half * .15, bottom + size * .001, x + half * .54, bottom - size * .004);
    paint.stroke();
  }
}

function drawCabin(paint, x, y, size) {
  const glow = paint.createRadialGradient(x, y - size * .34, 0, x, y - size * .34, size * 1.15);
  glow.addColorStop(0, '#ffbb596e');
  glow.addColorStop(1, '#ffbb5900');
  paint.fillStyle = glow;
  paint.fillRect(x - size * 1.3, y - size * 1.45, size * 2.6, size * 2.3);
  paint.fillStyle = '#624342';
  paint.fillRect(x - size * .55, y - size * .51, size * 1.10, size * .51);
  paint.fillStyle = '#22354c';
  paint.beginPath();
  paint.moveTo(x - size * .69, y - size * .49);
  paint.lineTo(x - size * .03, y - size * .91);
  paint.lineTo(x + size * .68, y - size * .49);
  paint.closePath();
  paint.fill();
  paint.strokeStyle = '#bdcde0';
  paint.lineWidth = 2.8;
  paint.stroke();
  paint.fillStyle = '#ffcf81';
  paint.fillRect(x - size * .37, y - size * .35, size * .20, size * .15);
  paint.fillRect(x + size * .17, y - size * .35, size * .20, size * .15);
  paint.fillStyle = '#302c35';
  paint.fillRect(x - size * .07, y - size * .30, size * .14, size * .30);
}

function starPath(x, y, r, arms = 4, inner = .24) {
  ctx.beginPath();
  for (let i = 0; i < arms * 2; i++) {
    const angle = i * Math.PI / arms - Math.PI / 2;
    const length = i % 2 ? r * inner : r;
    const px = x + Math.cos(angle) * length;
    const py = y + Math.sin(angle) * length;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function makeHalo(color) {
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = 96;
  const paint = sprite.getContext('2d');
  const gradient = paint.createRadialGradient(48, 48, 0, 48, 48, 48);
  gradient.addColorStop(0, color);
  gradient.addColorStop(1, color + '00');
  paint.fillStyle = gradient;
  paint.fillRect(0, 0, 96, 96);

}
const warmHalo = makeHalo('#ffe9a0');

const worldItems = [];
let cameraCos = 1, cameraSin = 0, galaxyWidth = 1;
const giftPapers = {
  classic: ['#ba203b', '#ef93a8', '#ead7b4', '#ffedce', '#dc3650'],
  ice: ['#406ba7', '#8bbddd', '#e9eef1', '#cadce9', '#5d91b8'],
  pink: ['#b8406b', '#ef91aa', '#f4c2c6', '#ffead6', '#ce5d82'],
};

function project(x, y, z) {
  const cameraX = x * cameraCos - z * cameraSin;
  const cameraZ = z * cameraCos + x * cameraSin;
  const depth = cameraZ * tiltCos + y * tiltSin;
  const scale = worldScale * cameraDistance / (cameraDistance - depth);
  return { x: center + cameraX * scale, y: ground + (cameraZ * tiltSin - y * tiltCos) * scale, depth, scale };
}

function polygon(points) {
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
}

function frontFacing(points) {
  const [a, b, c] = points;
  return (b.x - a.x) * (c.y - a.y) > (b.y - a.y) * (c.x - a.x);
}

function face(points, color, opacity = 1, edge) {
  if (frontFacing(points)) queueFace(points, color, opacity, edge);
}

function queueFace(points, color, opacity = 1, edge) {
  const depth = points.reduce((sum, p) => sum + p.depth, 0) / points.length;
  worldItems.push({ depth, points, color, opacity, edge });
}

function queueLight(point, color, size, opacity, bloom = false, shape = 'glow') {
  worldItems.push({ depth: point.depth, point, color, size, opacity, bloom, shape });
}

function drawPlatform() {
  const rim = [];
  const lip = [];
  for (let i = 0; i < 72; i++) {
    const angle = i / 72 * tau;
    const x = Math.cos(angle) * 2.30;
    const z = Math.sin(angle) * 2.30;
    rim.push(project(x, -.035, z));
    lip.push(project(x, -.15, z));
  }
  const gradient = ctx.createLinearGradient(0, ground - worldScale * .47, 0, ground + worldScale * .58);
  gradient.addColorStop(0, '#243854');
  gradient.addColorStop(.64, '#233557');
  gradient.addColorStop(1, '#152746');
  ctx.globalAlpha = .89;
  polygon(lip);
  ctx.fillStyle = '#050d20';
  ctx.fill();
  polygon(rim);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.strokeStyle = '#7894b250';
  ctx.lineWidth = .9;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

const foliage = Array.from({ length: 10 }, (_, tier) => {
  const base = .10 + tier * .489;
  const width = treeRadius * ((treeHeight - base) / treeHeight) ** .92;
  const count = 22;
  const ring = Array.from({ length: count }, (_, i) => {
    const angle = i / count * tau + tier * .23;
    const distance = width * (i % 2 ? .78 + random(.10) : .95 + random(.08));
    return [Math.cos(angle) * distance, base + random(.10), Math.sin(angle) * distance];
  });
  return ring.map((point, i) => {
    const next = ring[(i + 1) % count];
    const crown = [0, Math.min(treeHeight, base + 1.27), 0];
    const shade = '#' + [12 + i % 4 * 4, 36 + i % 4 * 6, 30 + i % 4 * 4].map(value => value.toString(16).padStart(2, '0')).join('');
    return { vertices: [crown, point, next], shade };
  });
}).flat();
const branchTips = foliage.map(({ vertices }) => vertices[1]);

function addFoliage(t, forming) {
  const opacity = (1 - spread) * (forming ? smoothProgress((t - .76) / 1.48) : 1);
  if (opacity < .025) return;
  for (const { vertices, shade } of foliage) {
    face(vertices.map(point => project(...point)), shade, opacity * .93);
  }
  for (const [index, tip] of branchTips.entries()) {
    const point = project(...tip);
    const lantern = index % 9 === 0;
    queueLight(point, lantern ? '#fff6dd' : '#dbcfa3', lantern ? 2.7 : 1.18, opacity * (lantern ? .87 : .58), lantern);
  }
}

const ambientLights = Array.from({ length: 61 }, (_, i) => {
  const level = .09 + i / 67;
  const angle = i * 2.39996;
  const distance = treeRadius * level ** .90 * 1.07;
  return { x: Math.cos(angle) * distance, y: treeHeight * (1 - level), z: Math.sin(angle) * distance, phase: random(tau) };
});
const roseHalo = makeHalo('#ff829d');
const iceHalo = makeHalo('#a8e1ff');
const whiteHalo = makeHalo('#fffaf0');

function addGarland(t, forming, energy) {
  const count = 236;
  const head = forming ? Math.min(1, t / 2.10) : 1;
  let previous;
  for (let i = 0; i <= Math.floor(count * head); i++) {
    const progress = i / count;
    const angle = -progress * tau * 7.3;
    const distance = treeRadius * (1 - progress) ** .89 * 1.03;
    const point = project(Math.cos(angle) * distance, .11 + progress * 5.04, Math.sin(angle) * distance);
    if (previous) {
      worldItems.push({ depth: (previous.depth + point.depth) / 2, segment: [previous, point], opacity: mix(.79, .16, spread) });
    }
    if (i % 4 === 0 && spread < .98) {
      const flare = .7 + .30 * Math.sin(i * 2.31 + t * 2.5);
      const nearHead = forming && head - progress < .045;
      queueLight(point, '#fff2c1', (nearHead ? 3.4 : 1.3 + flare + energy) * point.scale / worldScale, 1 - spread, nearHead || i % 12 === 0);
    }
    previous = point;
  }
  if (forming && previous) queueLight(previous, '#fff6dd', 5.9, 1 - spread, true, 'star');
  for (const [i, light] of ambientLights.entries()) {
    const alpha = (1 - spread) * (forming ? smoothProgress((t - (light.y / treeHeight) * 1.62) / .40) : 1);
    if (alpha < .025) continue;
    const point = project(light.x, light.y, light.z);
    const pulse = .79 + .21 * Math.sin(light.phase + t * 2.3);
    queueLight(point, ['#ffb4c5', '#ffe2a0', '#fff6dd'][i % 3],
      (2.8 + (i % 5) * .86 + energy * 2) * pulse * point.scale / worldScale, alpha * pulse, true, i % 7 === 0 ? 'star' : 'glow');
  }
}

function addParticles(t, forming, energy) {
  const palette = palettes[effects.palette] || [effects.color, effects.color, effects.color, '#ffe7a0', effects.color, '#fff3d5'];
  const count = Math.min(effects.density, particleBudget);
  const boost = Math.min(1.47, Math.sqrt(effects.density / count));
  for (let i = 0; i < count; i++) {
    const p = particles[i];
    const sparkle = .70 + .29 * Math.sin(p.phase + t * 1.7);
    const angle = p.angle + t * (.12 + .1 / p.galaxy);
    let x = mix(p.x * (1 + energy * .12), Math.cos(angle) * p.galaxy * galaxyWidth, spread);
    let z = mix(p.z * (1 + energy * .12), Math.sin(angle) * p.galaxy * galaxyWidth, spread);
    let y = mix(treeHeight * (1 - p.level), p.height + Math.sin(t + p.phase) * .16, spread);
    let opacity = sparkle;
    if (forming) {
      const travel = (t - (1 - p.level) * 1.26 - p.phase * .029) / 1.04;
      if (travel < -.03) continue;
      if (travel < 1) {
        const rise = smoothProgress(travel);
        const settle = smoothProgress((travel - .24) / .76);
        const spiral = t * 8.9 + p.level * 13 + p.phase * .48;
        const distance = mix(treeRadius * .94, Math.hypot(p.x, p.z), rise);
        x = mix(Math.cos(spiral) * distance, x, settle);
        z = mix(Math.sin(spiral) * distance, z, settle);
        y = mix(.07, y, rise);
        opacity *= smoothProgress((travel + .03) / .20);
      }
    }
    const point = project(x, y, z);
    if (point.x < -10 || point.x > width + 10 || point.y < -10 || point.y > height + 10) continue;
    const light = p.light || spread > .5 && i % 31 === 0;
    const colors = forming && t < 1.87 ? introPalette : palette;
    const color = spread > .65 && i % 11 === 0 ? '#ff9cba' :
      i % 3 === 0 && effects.palette === 'pine' ? '#fff6dd' : colors[p.color];
    const size = (p.size * boost + spread * .31 + (light ? 1.6 : 0)) * (1 + energy * .45) * point.scale / worldScale;
    queueLight(point, color, size, opacity * (light ? 1 : .82), light, effects.shape);
  }
}

function addStar(t, forming) {
  const glow = (forming ? smoothProgress((t - 1.82) / .53) : 1) * (1 - spread * .28);
  if (glow <= 0) return;
  const centerPoint = project(0, 5.40, 0);
  const angle = Math.atan2(cameraSin, cameraCos) + Math.sin(t * .66) * .39;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const vertices = [-1, 1].map(side => Array.from({ length: 10 }, (_, i) => {
    const turn = i / 10 * tau - Math.PI / 2;
    const distance = (i % 2 ? .144 : .351) * (.72 + glow * .28);
    const x = Math.cos(turn) * distance;
    const z = side * .077;
    return project(x * cos + z * sin, 5.40 - Math.sin(turn) * distance, -x * sin + z * cos);
  }));
  queueLight(centerPoint, '#fff0ad', 9.3 + effects.energy * 3, glow, true, 'star');
  const front = vertices[1];
  const back = vertices[0];
  for (let i = 0; i < front.length; i++) {
    const j = (i + 1) % front.length;
    queueFace([back[i], back[j], front[j], front[i]], i % 2 ? '#c68646' : '#f4c571', glow);
    queueFace([front[i], front[j], centerPoint], i % 2 ? '#fff5bb' : '#eac16e', glow);
  }
}

function worldPose(x, y, z, yaw, pitch = 0, roll = 0) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const p = Math.cos(pitch), q = Math.sin(pitch);
  const r = Math.cos(roll), k = Math.sin(roll);
  return (u, v, w) => {
    const localY = v * p - w * q;
    const localZ = w * p + v * q;
    const localX = u * r - localY * k;
    return project(x + localX * c + localZ * s, y + localY * r + u * k, z + localZ * c - localX * s);
  };
}

const cuboidFaces = [
  [3, 2, 1, 0, 0, 0], [2, 6, 5, 1, 0, .41], [6, 7, 4, 5, 0, .29],
  [7, 3, 0, 4, 0, .21], [7, 6, 2, 3, 1, 0], [0, 1, 5, 4, 0, .55],
];

function paintBox(pose, halfX, halfZ, base, top, paper, ribbons, opacity = 1) {
  const corners = [
    [-halfX, base, halfZ], [halfX, base, halfZ], [halfX, top, halfZ], [-halfX, top, halfZ],
    [-halfX, base, -halfZ], [halfX, base, -halfZ], [halfX, top, -halfZ], [-halfX, top, -halfZ],
  ].map(point => pose(...point));
  for (const [a, b, c, d, lid, shade] of cuboidFaces) {
    const points = [corners[a], corners[b], corners[c], corners[d]];
    if (!frontFacing(points)) continue;
    const depth = points.reduce((sum, p) => sum + p.depth, 0) / 4;
    worldItems.push({ depth, points, color: paper, opacity, ribbons, lid, shade });
  }
  return corners;
}

function placeControl(button, points, clickable) {
  const xs = points.map(point => point.x);
  const ys = points.map(point => point.y);
  const left = Math.min(...xs), top = Math.min(...ys);
  const buttonWidth = Math.max(...xs) - left;
  const buttonHeight = Math.max(...ys) - top;
  button.style.transform = 'translate3d(' + left.toFixed(1) + 'px,' + top.toFixed(1) + 'px,0)';
  button.style.width = buttonWidth.toFixed(1) + 'px';
  button.style.height = buttonHeight.toFixed(1) + 'px';
  const depth = points.reduce((sum, point) => sum + point.depth, 0) / points.length;
  button.style.zIndex = String(Math.round((depth + 7) * 20));
  button.hidden = !clickable || buttonWidth < 6 || buttonHeight < 6;
}

function addGifts(t, dt) {
  if (giftStage.hidden) return;
  const papers = giftPapers[effects.gift] || giftPapers.classic;
  for (const [i, gift] of giftModels.entries()) {
    const button = stageGifts[i];
    gift.lid = mix(gift.lid, button.classList.contains('is-open') ? 1 : 0, 1 - Math.exp(-dt * 10));
    const angle = gift.angle + t * .21;
    const distance = (1.38 + i % 8 * .14) * galaxyWidth;
    const x = mix(gift.x, Math.cos(angle) * distance, spread);
    const z = mix(gift.z, Math.sin(angle) * distance, spread);
    const y = (.55 + (i * 13 % 28) * .113 + Math.sin(t * 1.2 + i) * .15) * spread;
    const yaw = gift.angle + spread * t * .41;
    const pitch = Math.sin(angle) * spread * .83;
    const roll = Math.cos(angle) * spread * 1.1;
    const pose = worldPose(x, y, z, yaw, pitch, roll);
    const size = gift.size * mix(1, .61, spread);
    const halfX = size * (.47 + i % 3 * .07);
    const halfZ = size * (.43 + i % 4 * .06);
    const high = size * (.66 + i % 5 * .081);
    const paper = papers[gift.paper];
    const corners = paintBox(pose, halfX, halfZ, 0, high, paper, true);
    const lift = gift.lid;
    const lidPose = lift > .008 ? (u, v, w) => {
      const turn = lift * 1.18;
      const offset = w + halfZ;
      return pose(u + lift * .04, high + v * Math.cos(turn) + offset * Math.sin(turn), -halfZ + offset * Math.cos(turn) - v * Math.sin(turn));
    } : (u, v, w) => pose(u, high + v, w);
    paintBox(lidPose, halfX * 1.06, halfZ * 1.06, -.025, high * .17, paper, true);
    if (spread < .65) {
      const foot = project(x, -.01, z);
      ctx.globalAlpha = (1 - spread) * .49;
      ctx.beginPath();
      ctx.ellipse(foot.x + 1, foot.y + 1, (halfX + halfZ) * foot.scale * .78, high * foot.scale * .24, 0, 0, tau);
      ctx.fillStyle = '#090b1c';
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (lift > .02) queueLight(pose(0, high, 0), '#ffe9aa', high * .16 * worldScale, lift, true, 'star');
    const mid = pose(0, high / 2, 0);
    const behindTree = mid.depth < -.42 && Math.abs(mid.x - center) < treeRadius * worldScale * .80;
    placeControl(button, corners, !effects.scattered && !behindTree);
  }
}

function addFrames(t, forming) {
  const count = Math.max(7, memoryNodes.length - 1);
  const opacity = forming ? smoothProgress((t - 1.14) / 1.13) : 1;
  for (const [i, button] of memoryNodes.entries()) {
    const level = .20 + i / count * .69;
    const angle = i * 2.39996;
    const orbit = angle + t * .19;
    const distance = treeRadius * level ** .88 + .20;
    const outer = (.86 + (i * 11 % 13) * .114) * galaxyWidth;
    const x = mix(Math.sin(angle) * distance, Math.sin(orbit) * outer, spread);
    const z = mix(Math.cos(angle) * distance, Math.cos(orbit) * outer, spread);
    const y = mix(treeHeight * (1 - level), 1.05 + (i * 7 % 17) * .19 + Math.sin(t + i) * .15, spread);
    const angleToCamera = Math.atan2(cameraSin, cameraCos);
    const turn = angleToCamera + Math.sin(orbit) * .70 - angle;
    const yaw = angle + spread * Math.atan2(Math.sin(turn), Math.cos(turn));
    const pose = worldPose(x, y, z, yaw, -.08 + Math.sin(i * 1.2 + t * .5) * .10, Math.sin(i * 3.2) * .105);
    const size = .237 + i % 3 * .014 + spread * .035;
    const corners = paintBox(pose, size, .039, -size, size, '#ddbd90', false, opacity);
    const front = [corners[3], corners[2], corners[1], corners[0]];
    const visibleSide = frontFacing(front);
    const centerPoint = pose(0, 0, .042);
    if (visibleSide && opacity > .02) {
      const art = size * .77;
      const points = [pose(-art, art, .043), pose(art, art, .043), pose(art, -art, .043), pose(-art, -art, .043)];
      worldItems.push({ depth: front.reduce((sum, p) => sum + p.depth, 0) / 4 + .006, points, artwork: button, opacity });
    }
    const behindTree = spread < .48 && centerPoint.depth < y * tiltSin - .27 &&
      Math.abs(centerPoint.x - center) < distance * worldScale * .86;
    placeControl(button, corners, opacity > .60 && !behindTree && visibleSide);
  }
}

function strip(points, along, color) {
  const [a, b, c, d] = points;
  const interpolate = (p, q, t) => ({ x: mix(p.x, q.x, t), y: mix(p.y, q.y, t) });
  const ribbon = along ? [interpolate(a, d, .42), interpolate(b, c, .42), interpolate(b, c, .58), interpolate(a, d, .58)] :
    [interpolate(a, b, .42), interpolate(a, b, .58), interpolate(d, c, .58), interpolate(d, c, .42)];
  polygon(ribbon);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawFrameArt(item) {
  const [a, b, c, d] = item.points;
  ctx.save();
  polygon(item.points);
  ctx.fillStyle = '#fff1e3';
  ctx.fill();
  ctx.strokeStyle = '#78533f';
  ctx.lineWidth = .8;
  ctx.stroke();
  ctx.clip();
  const sx = (b.x - a.x + c.x - d.x) / 2;
  const sy = (b.y - a.y + c.y - d.y) / 2;
  const tx = (d.x - a.x + c.x - b.x) / 2;
  const ty = (d.y - a.y + c.y - b.y) / 2;
  ctx.transform(sx, sy, tx, ty, (a.x + b.x + c.x + d.x - 2 * sx - 2 * tx) / 4, (a.y + b.y + c.y + d.y - 2 * sy - 2 * ty) / 4);
  const image = frameArt.get(item.artwork);
  if (image?.naturalWidth) {
    const edge = Math.min(image.naturalWidth, image.naturalHeight);
    ctx.drawImage(image, (image.naturalWidth - edge) / 2, (image.naturalHeight - edge) / 2, edge, edge, -.03, -.03, 1.06, 1.06);
  } else if (image instanceof HTMLCanvasElement) {
    ctx.drawImage(image, 0, 0, 1, 1);
  }
  ctx.restore();
}

function drawWorld() {
  worldItems.sort((a, b) => a.depth - b.depth);
  ctx.lineCap = 'round';
  for (const item of worldItems) {
    ctx.globalAlpha = item.opacity;
    if (item.segment) {
      const [a, b] = item.segment;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = '#ffe4a1';
      ctx.lineWidth = Math.max(.67, worldScale * .012);
      ctx.stroke();
    } else if (item.point) {
      const { x, y } = item.point;
      const size = item.size;
      if (item.bloom) {
        const sprite = item.color === '#ffb4c5' || item.color === '#ff9cba' ? roseHalo :
          item.color === '#c1f5ff' || item.color === '#f5fcff' ? iceHalo :
          item.color === '#fff6dd' ? whiteHalo : warmHalo;
        const radius = size * (size > 7 ? 5.2 : 4.2);
        ctx.globalAlpha = item.opacity * .78;
        ctx.drawImage(sprite, x - radius, y - radius, 2 * radius, 2 * radius);
        ctx.globalAlpha = item.opacity;
      }
      ctx.fillStyle = item.color;
      if (item.shape === 'star' || item.shape === 'diamond') {
        starPath(x, y, size * 1.44, 4, item.shape === 'star' ? .22 : .015);
        ctx.fill();
      } else if (size > 2) {
        ctx.beginPath();
        ctx.arc(x, y, size * .62, 0, tau);
        ctx.fill();
      } else {
        ctx.fillRect(x - size / 2, y - size / 2, size, size);
      }
    } else if (item.artwork) {
      drawFrameArt(item);
    } else {
      polygon(item.points);
      ctx.fillStyle = item.color;
      ctx.fill();
      if (item.ribbons) {
        strip(item.points, false, item.lid ? '#ffeec7' : '#e8c782');
        if (item.lid) strip(item.points, true, '#fff2d1');
      }
      if (item.shade) {
        polygon(item.points);
        ctx.fillStyle = 'rgba(13,16,42,' + item.shade + ')';
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  worldItems.length = 0;
}

function drawScene(t, dt) {
  if (t >= formationTime || effects.scattered || reducedSceneMotion.matches) introFinished = true;
  const forming = !introFinished;
  const status = forming ? '星光汇聚中' : effects.scattered ? '粒子已散开' : '粒子已汇聚';
  if (stageStatus.textContent !== status) stageStatus.textContent = status;
  spread = mix(spread, Number(effects.scattered), 1 - Math.exp(-dt * 3.1));
  orbitAngle = mix(orbitAngle, effects.orbit, 1 - Math.exp(-dt * 7));
  if (!albumDialog.open && !reducedSceneMotion.matches && !document.activeElement?.matches('.stage-gift, .memory-token')) {
    autoAngle = (autoAngle + dt * mix(.23, .10, spread)) % tau;
  }
  const angle = autoAngle + orbitAngle;
  cameraCos = Math.cos(angle);
  cameraSin = Math.sin(angle);
  galaxyWidth = Math.max(1, Math.min(2.8, width / (worldScale * 5.5)));
  if (backdropTheme !== effects.scenery) drawBackdrop();
  ctx.drawImage(backdrop, 0, 0, width, height);
  drawPlatform();
  addFoliage(t, forming);
  addParticles(t, forming, effects.energy);
  addGarland(t, forming, effects.energy);
  addGifts(t, dt);
  addFrames(t, forming);
  addStar(t, forming);
  drawWorld();
  ctx.fillStyle = '#eef3f5';
  for (const [x, y, size, speed] of snow) {
    ctx.globalAlpha = .16 + speed * .46;
    const sx = (x * width + Math.sin(t * .25 + y * 20) * 19 + width) % width;
    const sy = (y * height + t * (8 + speed * 19)) % height;
    ctx.fillRect(sx, sy, size, size);

}

function render(now) {
  frame = 0;
  const targetStep = mobile ? 1000 / 30 : 1000 / 60;
  const step = lastFrame ? now - lastFrame : targetStep;
  if (step < targetStep - 2) {
    invalidateScene();
    return;
  }
  if (lastFrame) elapsed += Math.min(step, 100);
  const start = performance.now();
  drawScene(elapsed / 1000, Math.min(step, 100) / 1000);
  lastFrame = now;
  averageCost = mix(averageCost, performance.now() - start, .12);
  averageStep = mix(averageStep || step, step, .12);
  samples++;
  if (samples % 12 === 0 && (averageCost > targetStep * .53 || averageStep > targetStep * 1.38)) {
    particleBudget = Math.max(600, particleBudget - 250);
  } else if (samples % 48 === 0 && averageCost < targetStep * .32 && averageStep < targetStep * 1.19) {
    const ceiling = mobile ? 2400 : maxParticles;
    particleBudget = Math.min(ceiling, particleBudget + 150);
  }
  invalidateScene();
}

const modelUrl = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';

function classifyGesture(result, aspect = 1) {
  const gesture = result.gestures[0]?.[0];
  const hand = result.worldLandmarks?.[0] || result.landmarks[0];
  if (!hand) return null;
  if (gesture?.categoryName === 'Closed_Fist' && gesture.score >= .61) return 'tree';
  const worldCoordinates = Boolean(result.worldLandmarks?.[0]);
  const distance = (a, b) => Math.hypot(
    (hand[a].x - hand[b].x) * (worldCoordinates ? 1 : aspect),
    hand[a].y - hand[b].y,
    worldCoordinates ? hand[a].z - hand[b].z : 0,
  );
  const palm = Math.max(distance(0, 9), distance(5, 17));
  const pinch = palm > 0 && distance(4, 8) / palm < .29;
  if (pinch) return 'photo';
  if (gesture?.categoryName === 'Open_Palm' && gesture.score >= .55) return 'scatter';
  return null;
}

function setupCamera(onGesture, onPosition) {
  const button = document.querySelector('#camera');
  const label = button.querySelector('span');
  const preview = document.querySelector('#preview');
  const box = document.querySelector('#camera-box');
  const status = document.querySelector('#camera-status');
  const cards = [...document.querySelectorAll('[data-gesture]')];
  const labels = { tree: '已识别握拳', scatter: '已识别摊手', photo: '已识别捏指' };
  let stream, recognizer, frame, generation = 0;
  let candidate = null, lastGesture = null, streak = 0;
  let lastFrame = -Infinity, lastVideoTime = -1, detectionInterval = 75, busy = false;

  function publish(message, action = null) {
    if (status.textContent !== message) status.textContent = message;
    for (const card of cards) card.classList.toggle('active', card.dataset.gesture === action);
  }

  function stop(message = '开启摄像头后，将一只手放在画面内。') {
    generation++;
    cancelAnimationFrame(frame);
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    preview.srcObject = null;
    box.hidden = true;
    busy = false;
    button.removeAttribute('aria-busy');
    label.textContent = '开启摄像头';
    candidate = lastGesture = null;
    streak = 0;
    lastFrame = -Infinity;
    lastVideoTime = -1;
    detectionInterval = 75;
    publish(message);
  }

  function detect(now) {
    if (!stream) return;
    frame = requestAnimationFrame(detect);
    if (now - lastFrame < detectionInterval || preview.readyState < 2 || preview.currentTime === lastVideoTime) return;
    lastFrame = now;
    lastVideoTime = preview.currentTime;
    try {
      const started = performance.now();
      const result = recognizer.recognizeForVideo(preview, now);
      onPosition?.(result.landmarks[0]?.[9]?.x ?? null);
      const cost = performance.now() - started;
      detectionInterval = detectionInterval * .85 + Math.max(75, Math.min(240, cost * 3)) * .15;
      const action = classifyGesture(result, preview.videoWidth / preview.videoHeight);
      if (action !== candidate) {
        candidate = action;
        streak = 1;
        return;
      }
      streak++;
      if (streak < 3 || lastGesture === action) return;
      lastGesture = action;
      if (action) {
        publish(labels[action], action);
        onGesture(action);
      } else {
        publish('等待手势 · 握拳、摊手或捏指');
      }
    } catch {
      stop('手势识别已停止，请重新开启摄像头。');
    }
  }

  button.addEventListener('click', async () => {
    if (stream || busy) {
      stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      publish('请通过 HTTPS 或 localhost 打开网页以启用摄像头。');
      return;
    }
    const attempt = ++generation;
    busy = true;
    button.setAttribute('aria-busy', 'true');
    label.textContent = '取消启动';
    publish('等待摄像头权限…');
    try {
      const acquired = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      });
      if (generation !== attempt) {
        acquired.getTracks().forEach(track => track.stop());
        return;
      }
      stream = acquired;
      preview.srcObject = stream;
      stream.getVideoTracks()[0]?.addEventListener('ended', () => {
        if (generation === attempt) stop('摄像头已断开。');
      });
      box.hidden = false;
      publish('正在加载手势模型…');
      await preview.play();
      if (!recognizer) {
        const { FilesetResolver, GestureRecognizer } = await import(modelBase + '/vision_bundle.mjs');
        const vision = await FilesetResolver.forVisionTasks(modelBase + '/wasm');
        const loaded = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
          runningMode: 'VIDEO', numHands: 1,
        });
        if (generation !== attempt) {
          loaded.close();
          return;
        }
        recognizer = loaded;
      }
      if (generation !== attempt) return;
      busy = false;
      button.removeAttribute('aria-busy');
      label.textContent = '关闭摄像头';
      publish('等待手势 · 握拳、摊手或捏指');
      frame = requestAnimationFrame(detect);
    } catch (error) {
      if (generation !== attempt) return;
      const reason = {
        NotAllowedError: '摄像头权限未开启，仍可使用树下按钮。',
        NotFoundError: '未找到摄像头，仍可使用树下按钮。',
        NotReadableError: '摄像头暂不可用，请检查是否被其他应用占用。',
      };
      stop(reason[error.name] || '摄像头或手势模型加载失败，请检查网络后重试。');
    }
  });
  window.addEventListener('pagehide', () => stop());
}

const builtinSongs = {

function setupMusic(onEnergy) {
  const button = document.querySelector('#play');
  const fileInput = document.querySelector('#music-file');
  const track = document.querySelector('#track');
  const customOption = track.querySelector('option[value=custom]');
  const state = document.querySelector('#track-state');
  const audio = new Audio();
  audio.loop = true;
  audio.preload = 'none';
  audio.crossOrigin = 'anonymous';
  let context, analyser, spectrum, sourceUrl, objectUrl, frame, energy = 0;
  let trackVersion = 0;
  let customFile;

  function setSource() {
    audio.pause();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = null;
    sourceUrl = null;
    if (track.value === 'custom') {
      if (customFile) sourceUrl = objectUrl = URL.createObjectURL(customFile);
    } else if (builtinSongs[track.value]) {
      const base = location.protocol === 'file:' ? 'https://cloud789922.github.io/1/' : location.href;
      sourceUrl = new URL(builtinSongs[track.value], base).href;
    }
    if (sourceUrl) audio.src = sourceUrl;
    else {
      audio.removeAttribute('src');
      audio.load();
    }
    trackVersion++;
  }

  function sample() {
    if (audio.paused) return;
    analyser.getByteFrequencyData(spectrum);
    let level = 0;
    for (let i = 2; i < 29; i++) {
      level += spectrum[i] * (i < 8 ? 1.35 : 1);
    }
    const peak = Math.min(1, level / (255 * 16));
    energy += (peak - energy) * (peak > energy ? .41 : .16);
    onEnergy(energy);
    frame = requestAnimationFrame(sample);
  }

  async function play() {
    if (!sourceUrl) setSource();
    if (!sourceUrl) return;
    const version = trackVersion;
    try {
      if (!context) {
        context = new AudioContext();
        analyser = context.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = .48;
        spectrum = new Uint8Array(analyser.frequencyBinCount);
        const source = context.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(context.destination);
      }
      await Promise.all([context.resume(), audio.play()]);
    } catch (error) {
      if (version !== trackVersion || error.name === 'AbortError') return;
      audio.pause();
      state.textContent = '无法播放，请选择其他音频或重试。';
    }
  }

  button.addEventListener('click', () => {
    if (audio.paused) void play();
    else audio.pause();
  });
  audio.addEventListener('playing', () => {
    button.textContent = 'Ⅱ';
    button.setAttribute('aria-label', '暂停音乐');
    state.textContent = '正在播放 · 粒子随音乐律动';
    cancelAnimationFrame(frame);
    sample();
  });
  audio.addEventListener('pause', () => {
    if (!audio.paused) return;
    button.textContent = '▶';
    button.setAttribute('aria-label', '播放音乐');
    state.textContent = '已暂停';
    cancelAnimationFrame(frame);
    energy = 0;
    onEnergy(0);
  });
  audio.addEventListener('error', () => {
    if (!sourceUrl) return;
    state.textContent = '无法读取这段音频，请重新选择。';
  });
  track.addEventListener('change', () => {
    const resume = !audio.paused;
    setSource();
    state.textContent = track.value === 'custom' ? '本地音乐 · 点击播放' : '内置音乐 · 点击播放';
    if (resume) void play();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    customFile = file;
    customOption.hidden = false;
    customOption.textContent = file.name;
    track.value = 'custom';
    setSource();
    void play();
  });
}

async function restorePhotos() {
  for (const source of Array.isArray(shared.photos) ? shared.photos : []) {
    try {
      const [metadata, data] = source.data.split(',');
      if (!metadata.startsWith('data:image/') || !metadata.endsWith(';base64')) continue;
      const bytes = Uint8Array.from(atob(data), char => char.charCodeAt(0));
      photos.push(hydrate({ name: source.name, blob: new Blob([bytes], { type: metadata.slice(5, -7) }), cached: false }));
    } catch {}
  }
  let records;
  try {
    records = await transaction('readonly', store => store.getAll());
  } catch {
    $('#photo-status').textContent = '浏览器存储不可用，照片仅在本次打开时显示。';
    return;
  }
  records.sort((a, b) => a.added - b.added);
  photos.push(...records.map(record => hydrate({ ...record, cached: true })));
}
const photosReady = restorePhotos().then(() => {
  renderPhotos();
});
renderGiftLibrary();
renderMemoryCards();
$('#photo-file').addEventListener('change', async event => {
  const input = event.target;
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  input.disabled = true;
  await photosReady;
  let added = 0;
  let temporary = 0;
  for (const [index, file] of files.entries()) {
    try {
      const bitmap = await createImageBitmap(file);
      bitmap.close();
    } catch { continue; }
    const record = { id: crypto.randomUUID(), name: file.name, blob: file, added: Date.now() + index };
    let cached = true;
    try {
      await transaction('readwrite', store => store.add(record));
    } catch {
      cached = false;
      temporary++;
    }
    photos.push(hydrate({ ...record, cached }));
    added++;
  }
  renderPhotos();
  const messages = [];
  if (added - temporary) messages.push('已缓存 ' + (added - temporary) + ' 张照片');
  if (temporary) messages.push(temporary + ' 张仅在本次显示');
  if (files.length > added) messages.push(files.length - added + ' 张图片无法读取');
  $('#photo-status').textContent = messages.join('，') + '。';
  input.disabled = false;
});

const dialog = $('#album');
const greetingCover = $('#open-greeting');
const greetingPicture = $('#greeting-picture');
const largePhoto = $('#large-photo');
const largeGift = $('#large-gift');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let albumRequest = 0;
let giftEntrance, coverTurn, pictureReveal;
let openGift, previousGift;
let nextGiftIndex = 0;

function setPicture(entry) {
  $('#greeting-empty').hidden = Boolean(entry);
  largePhoto.hidden = !entry?.photo;
  largeGift.hidden = !entry || Boolean(entry.photo);
  if (entry?.photo) {
    largePhoto.src = entry.photo.url;
    largePhoto.alt = entry.name;
  } else if (entry) {
    largeGift.querySelector('span').textContent = entry.icon;
    largeGift.querySelector('strong').textContent = entry.name;
  }
}

function nextMemory(index) {
  if (photos.length) {
    currentPhoto = ((index % photos.length) + photos.length) % photos.length;
    const photo = photos[currentPhoto];
    return { photo, name: photo.name };
  }
  const gifts = selectedGifts();
  if (gifts.length) {
    const [icon, name] = gifts[nextGiftIndex++ % gifts.length];
    return { icon, name };
  }
  return null;
}

function showMemoryEntry(entry, origin) {
  if (dialog.open) return;
  setPicture(entry);
  greetingCover.hidden = true;
  dialog.showModal();
  showPicture(origin);
}

function chooseGift(requestedGift) {
  if (effects.scattered) return;
  const candidates = (requestedGift ? [requestedGift] : stageGifts)
    .map(button => ({ button, bounds: button.getBoundingClientRect() }))
    .filter(({ bounds }) => bounds.width && bounds.top + bounds.height * .36 > 0 &&
      bounds.top + bounds.height * .36 < innerHeight);
  const fresh = candidates.filter(({ button }) => button !== previousGift);
  const available = fresh.length ? fresh : candidates;
  return available[Math.floor(Math.random() * available.length)];
}

function showGiftCard(index, requestedGift) {
  if (dialog.open) return;
  setPicture(nextMemory(index));
  const chosen = chooseGift(requestedGift);
  const origin = motionPreference.matches ? null : chosen?.bounds;
  if (chosen) {
    openGift = previousGift = chosen.button;
    openGift.classList.add('is-open');
  }
  if (origin && greetingCover.animate) {
    dialog.classList.add('gift-opening');
  }
  greetingCover.hidden = false;
  greetingPicture.hidden = true;
  dialog.classList.remove('show-picture');
  dialog.showModal();
  greetingCover.focus({ preventScroll: true });
  if (!origin || !greetingCover.animate) return;

  const card = greetingCover.getBoundingClientRect();
  const left = origin.left + origin.width / 2 - card.left - card.width / 2;
  const top = origin.top + origin.height * .46 - card.top - card.height / 2;
  giftEntrance = greetingCover.animate([
    { transform: `translate(${left}px,${top}px) scale(.09) rotate(-9deg)`, opacity: 0, offset: 0 },
    { transform: `translate(${left}px,${top - 24}px) scale(.18) rotate(-8deg)`, opacity: 1, offset: .27 },
    { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1, offset: 1 },
  ], { duration: 620, easing: 'cubic-bezier(.16,.72,.32,1)' });
}

function showPicture(origin) {
  greetingCover.hidden = true;
  greetingPicture.hidden = false;
  dialog.classList.add('show-picture');
  greetingPicture.focus({ preventScroll: true });
  if (!motionPreference.matches && greetingPicture.animate) {
    let start = { transform: 'perspective(880px) rotateY(18deg) scale(.94)', opacity: .42 };
    if (origin) {
      const revealed = greetingPicture.getBoundingClientRect();
      const x = origin.left + origin.width / 2 - revealed.left - revealed.width / 2;
      const y = origin.top + origin.height / 2 - revealed.top - revealed.height / 2;
      const scale = origin.width / revealed.width;
      start = { transform: `translate(${x}px,${y}px) rotate(-6deg) scale(${scale})`, opacity: .8 };
    }
    pictureReveal = greetingPicture.animate([
      start,
      { transform: 'perspective(880px) rotateY(0) scale(1)', opacity: 1 },
    ], { duration: origin ? 440 : 270, easing: 'cubic-bezier(.2,.72,.26,1)' });
  }
}

function openGreeting() {
  if (!dialog.open || greetingCover.hidden || coverTurn) return;
  giftEntrance?.cancel();
  if (motionPreference.matches || !greetingCover.animate) {
    showPicture();
    return;
  }
  coverTurn = greetingCover.animate([
    { transform: 'perspective(880px) rotateY(0)', transformOrigin: 'left center', opacity: 1 },
    { transform: 'perspective(880px) rotateY(-85deg)', transformOrigin: 'left center', opacity: .35 },
  ], { duration: 235, easing: 'ease-in', fill: 'forwards' });
  coverTurn.onfinish = () => {
    coverTurn.cancel();
    coverTurn = null;
    if (dialog.open) showPicture();
  };
}

function showNextPhoto(requestedGift) {
  const request = ++albumRequest;
  void photosReady.then(() => {
    if (request !== albumRequest) return;
    if (!dialog.open) showGiftCard(currentPhoto + 1, requestedGift);
    else if (!greetingCover.hidden) openGreeting();
  });
}

for (const gift of stageGifts) gift.onclick = () => showNextPhoto(gift);
greetingCover.onclick = openGreeting;
$('#greeting-add').onclick = () => {
  dialog.close();
  studio.showModal();
  $('#photo-panel').scrollIntoView({ block: 'nearest' });
  $('#photo-file').focus({ preventScroll: true });
};
dialog.addEventListener('close', () => {
  giftEntrance?.cancel();
  coverTurn?.cancel();
  pictureReveal?.cancel();
  giftEntrance = coverTurn = pictureReveal = null;
  openGift?.classList.remove('is-open');
  openGift = null;
  dialog.classList.remove('gift-opening');
});
dialog.addEventListener('click', event => {
  const target = event.target;
  if (target === dialog || target === greetingPicture || target.classList.contains('photo-card')) dialog.close();
});

function act(action, gesture = false) {
  if (action === 'photo') {
    if (effects.scattered && !dialog.open) openNearestMemory();
    else showNextPhoto();
  }
  else {
    albumRequest++;
    if (gesture && dialog.open) dialog.close();
    setScene(action);
  }
}
for (const button of document.querySelectorAll('[data-action]')) {
  button.addEventListener('click', () => act(button.dataset.action));
}

function openNearestMemory() {
  const targetX = innerWidth * .50;
  const targetY = innerHeight * .53;
  const cards = [...$('#floating-memories').children];
  let closest, distance = Infinity;
  for (const card of cards) {
    if (card.hidden) continue;
    const box = card.getBoundingClientRect();
    const offset = Math.hypot(box.left + box.width / 2 - targetX, box.top + box.height / 2 - targetY);
    if (offset < distance) {
      closest = card;
      distance = offset;
    }
  }
  if (closest) closest.click();
  else showNextPhoto();
}

const roomCanvas = $('#scene');
let drag;
roomCanvas.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  drag = { id: event.pointerId, x: event.clientX };
  roomCanvas.setPointerCapture(event.pointerId);
});
roomCanvas.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  effects.orbit += (event.clientX - drag.x) * .006;
  drag.x = event.clientX;
  invalidateScene();
});
roomCanvas.addEventListener('lostpointercapture', () => { drag = null; });

let handX = null;
setupCamera(action => {
  if (!studio.open) act(action, true);
}, position => {
  if (effects.scattered && !studio.open && !dialog.open && position !== null && handX !== null) {
    const movement = position - handX;
    if (Math.abs(movement) > .005) effects.orbit -= movement * 5.2;
  }
  handX = position;
});
const cameraStatus = $('#camera-status');
const cameraFeedback = $('#camera-feedback');
new MutationObserver(() => {
  cameraFeedback.textContent = cameraStatus.textContent;
  cameraFeedback.hidden = false;
}).observe(cameraStatus, { childList: true, characterData: true, subtree: true });

$('#open-studio').onclick = () => studio.showModal();
$('#open-music').onclick = () => {
  studio.showModal();
  $('#music-panel').scrollIntoView({ block: 'nearest' });
  $('#music-panel').focus({ preventScroll: true });
};
$('#close-studio').onclick = () => studio.close();
const fullscreenButton = $('#fullscreen');
if (document.fullscreenEnabled && stage.requestFullscreen) {
  fullscreenButton.hidden = false;
  fullscreenButton.onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {}
  };
  document.addEventListener('fullscreenchange', () => {
    fullscreenButton.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });
}
studio.addEventListener('click', event => {
  const bounds = studio.getBoundingClientRect();
  if (event.target === studio && (event.clientX < bounds.left || event.clientX > bounds.right)) studio.close();
});

const trackSelect = $('#track');
if ([...trackSelect.options].some(option => option.value === settings.track && !option.hidden)) trackSelect.value = settings.track;
trackSelect.addEventListener('change', () => {
  if (trackSelect.value !== 'custom') {
    settings.track = trackSelect.value;
    saveSettings();
  }
});
setupMusic(energy => { effects.energy = energy; });

function readPhotoData(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function exportWish() {
  const snapshot = documentShell.cloneNode(true);
  snapshot.querySelector('#stage-gifts').replaceChildren();
  snapshot.querySelector('#wish-data')?.remove();
  const moduleScript = snapshot.querySelector('head script[type=module]');
  if (moduleScript.hasAttribute('src')) {
    const files = ['scene.js', 'camera.js', 'music.js', 'app.js', 'style.css'];
    const loaded = await Promise.all(files.map(async name => {
      const response = await fetch('./' + name);
      if (!response.ok) throw new Error('Could not load ' + name);
      return response.text();
    }));
    const css = document.createElement('style');
    css.textContent = loaded.pop();
    snapshot.querySelector('head link[rel=stylesheet]').replaceWith(css);
    moduleScript.removeAttribute('src');
    moduleScript.textContent = loaded.map(source => source
      .replace(/^import .*;\r?\n/gm, '')
      .replace(/^export (?=const |function )/gm, '')).join('\n');
  }
  const data = document.createElement('script');
  data.id = 'wish-data';
  data.type = 'application/json';
  const packaged = await Promise.all(photos.map(async photo => ({ name: photo.name, data: await readPhotoData(photo.blob) })));
  data.textContent = JSON.stringify({ id: crypto.randomUUID(), settings, photos: packaged }).replace(/</g, '\\u003c');
  moduleScript.before(data);
  const file = new Blob(['<!doctype html>\n' + snapshot.outerHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(file);
  const download = document.createElement('a');
  download.href = url;
  download.download = '我的冬夜星树.html';
  download.click();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

const shareButton = $('#download-wish');
shareButton.onclick = async () => {
  shareButton.disabled = true;
  $('#share-status').textContent = '正在准备网页文件…';
  try {
    await photosReady;
    await exportWish();
    $('#share-status').textContent = '专属网页已生成。';
  } catch {
    $('#share-status').textContent = '生成失败，请重新尝试。';
  } finally {
    shareButton.disabled = false;
  }
};

</script>
