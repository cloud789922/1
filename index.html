<script type="module">
const canvas = document.querySelector('#scene');
const ctx = canvas.getContext('2d', { alpha: false });
const giftTarget = document.querySelector('#stage-gift');
const stageStatus = document.querySelector('#mode').lastChild;
const tau = Math.PI * 2;
const formationTime = 2.28;
const launchStagger = .89;
const spiralTime = 1.48;
const maxParticles = 4300;
const palettes = {
  pine: ['#3a9c67', '#69df95', '#b7fcc3', '#ffe7a0', '#85c58e', '#fff3d5'],
  frost: ['#427eb3', '#67c4f2', '#c1f5ff', '#e8eaff', '#7dbddd', '#f5fcff'],
  rose: ['#a44470', '#f579a9', '#ffc0d9', '#ffe5ad', '#e68fbd', '#fff2e2'],
};
const introPalette = ['#c6a266', '#e8bf76', '#ffe6aa', '#fff0c9', '#dbb679', '#fff9de'];
const giftColors = {
  classic: ['#813c37', '#522c2e', '#d08362', '#f1c87e'],
  ice: ['#416f94', '#2a4964', '#77acd0', '#d0ecf2'],
  pink: ['#9b496e', '#603146', '#d8799f', '#f6c9d3'],
};
const effects = { scattered: false, density: 3000, palette: 'pine', color: '#8fe8af', shape: 'glow', gift: 'classic', energy: 0 };
let width, height, center, top, tall, ground, radius, mobile;
let spread = 0;
const random = (max = 1) => Math.random() * max;
const mix = (a, b, t) => a + (b - a) * t;
function smoothProgress(value) {
  const t = Math.max(0, Math.min(1, value));
  return t * t * (3 - 2 * t);
}
const particles = Array.from({ length: maxParticles }, (_, i) => {
  const y = Math.pow(random(), .83);
  const angle = random(tau);
  const branch = 0.73 + 0.27 * ((y * 6.4) % 1);
  const radius = Math.pow(y, .91) * branch * (0.17 + .83 * Math.sqrt(random()));
  return {
    y, x: Math.cos(angle) * radius, z: Math.sin(angle) * radius,
    sx: random(1.92) - .96, sy: random(.9) - .43,
    size: .35 + random(1.25) + (i % 57 === 0 ? 1.4 : 0),
    phase: random(tau), color: Math.floor(random(6)), light: i % 49 === 0, index: i,

});
const particlesByColor = Array.from({ length: 6 }, (_, color) => particles.filter(p => p.color === color));
const stars = Array.from({length: 195}, () => [random(), random(), random(1.5) + .25, random()]);
const snow = Array.from({length: 82}, () => [random(), random(), random(1.7) + .3, random()]);

const ornaments = [

  [.52, .77, '#ffe8ac'], [.60, 3.28, '#f2a7a0'], [.67, 5.31, '#ffcf83'],

let introFinished = false;

function resize() {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  const wasMobile = mobile;
  width = bounds.width;
  height = bounds.height;
  mobile = width < 600;
  const ratio = Math.min(window.devicePixelRatio || 1, mobile ? 1.25 : 1.6, Math.sqrt(1200000 / (width * height)));
  canvas.width = Math.round(width * ratio);

    samples = averageCost = averageStep = 0;
  }
  center = width * (width > 650 ? .55 : .51);
  top = height * (width > 650 ? .235 : .27);
  tall = height * .56;
  ground = top + tall;
  radius = Math.min(width * .40, tall * .64);
  const boxSize = Math.max(62, Math.min(90, radius * .31));

  giftTarget.style.left = center + radius * .55 + 'px';
  giftTarget.style.top = ground + (mobile ? 4 : 21) - boxSize + 'px';

  invalidateScene();
}

function drawBackdrop() {
  backdrop.width = canvas.width;

  const glow = backdropCtx.createRadialGradient(width * .52, height * .66, 0, width * .52, height * .66, height * .59);

  backdropCtx.fillRect(0, 0, width, height);
  for (const [x, y, size, brightness] of stars) {
    backdropCtx.globalAlpha = .22 + .50 * brightness;
    backdropCtx.fillStyle = size > 1.35 ? '#e2d09b' : '#a3baaa';

  const floor = backdropCtx.createRadialGradient(center, ground + 4, 0, center, ground + 4, radius * 1.15);
  floor.addColorStop(0, '#3f6c49');
  floor.addColorStop(1, '#3f6c4900');
  backdropCtx.globalAlpha = .23;
  backdropCtx.fillStyle = floor;
  backdropCtx.fillRect(0, 0, width, height);
  for (let ring = 0; ring < 6; ring++) {
    backdropCtx.globalAlpha = .21 - ring * .023;
    backdropCtx.strokeStyle = ring % 2 ? '#a09659' : '#b2ae71';
    backdropCtx.beginPath();
    backdropCtx.ellipse(center, ground + 11, radius * (.68 + ring * .12), 12 + ring * 6, 0, 0, tau);

  backdropCtx.globalAlpha = 1;
}

function starPath(x, y, r, arms = 4, inner = .24) {
  ctx.beginPath();
  for (let i = 0; i < arms * 2; i++) {
    const angle = i * Math.PI / arms - Math.PI / 2;
    const length = i % 2 ? r * inner : r;
    const px = x + Math.cos(angle) * length;
    const py = y + Math.sin(angle) * length;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();

function makeHalo(color) {
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = 96;
  const paint = sprite.getContext('2d');
  const gradient = paint.createRadialGradient(48, 48, 0, 48, 48, 48);

const warmHalo = makeHalo('#ffe9a0');

function drawOpeningSpiral(t, rotation) {

    }
    ctx.globalAlpha = fade * (strand ? .17 : .41);

    ctx.lineWidth = strand ? 3.1 : 1.1;

  const headRadius = Math.pow(1 - head, .91) * radius;
  const angle = (1 - head) * tau * 6.55 - rotation;
  const x = center + Math.cos(angle) * headRadius;
  const y = ground - head * tall + Math.sin(angle) * headRadius * .235;
  drawHalo(x, y, 24, fade * .68);

  ctx.lineTo(x + size + depth, y - size * .97);
  ctx.lineTo(x + size, y - size * .74);
  ctx.fill();
  ctx.fillStyle = colors[1];
  ctx.beginPath();
  ctx.moveTo(x + size, y);
  ctx.lineTo(x + size + depth, y - size * .23);
  ctx.lineTo(x + size + depth, y - size * .97);
  ctx.lineTo(x + size, y - size * .74);
  ctx.fill();
  ctx.fillStyle = colors[3];
  ctx.fillRect(x + size * .43, y - size * .76, size * .14, size * .76);
  ctx.fillRect(x, y - size * .39, size, size * .07);
  ctx.beginPath();
  ctx.moveTo(x + size * .43, y - size * .74);
  ctx.lineTo(x + size * .57, y - size * .74);
  ctx.lineTo(x + depth + size * .57, y - size * .97);
  ctx.lineTo(x + depth + size * .43, y - size * .97);
  ctx.fill();
  ctx.strokeStyle = colors[3];
  ctx.lineWidth = Math.max(1, size * .05);
  ctx.beginPath();
  const bow = x + size * .64;
  const top = y - size * .88;
  ctx.moveTo(bow, top);
  ctx.bezierCurveTo(bow - size * .6, top - size * .39, bow - size * .49, top + size * .07, bow, top);
  ctx.bezierCurveTo(bow + size * .26, top - size * .49, bow + size * .55, top - size * .10, bow, top);
  ctx.stroke();
}

function drawScene(t, dt) {
  if (t >= formationTime || effects.scattered) introFinished = true;
  const forming = !introFinished;
  const status = forming ? '星光汇聚中' : effects.scattered ? '粒子已散开' : '粒子已汇聚';
  if (stageStatus.textContent !== status) stageStatus.textContent = status;
  spread = mix(spread, Number(effects.scattered), 1 - Math.exp(-dt * 3.4));
  const energy = effects.energy;
  const palette = palettes[effects.palette] || [effects.color, effects.color, effects.color, '#ffe7a0', effects.color, '#fff3d5'];
  ctx.drawImage(backdrop, 0, 0, width, height);
  const rotation = t * .76;
  const cos = Math.cos(rotation);
  const sin = Math.sin(rotation);
  const count = Math.min(effects.density, particleBudget);
  const sizeBoost = Math.min(1.48, Math.sqrt(effects.density / count));
  const shape = effects.shape;
  const goldRelease = forming ? smoothProgress((t - 1.51) / .77) : 1;
  for (const [color, group] of particlesByColor.entries()) {
    ctx.fillStyle = palette[color];
    for (const p of group) {
      if (p.index >= count) break;
      // Lower rows take flight first, with an orbit that tightens as each row settles.
      const travel = forming ? (t - (1 - p.y) * launchStagger + .11 - p.phase * .021) / .69 : 1;
      if (travel < -.18) continue;
      const spin = p.x * cos + p.z * sin;
      const depth = p.z * cos - p.x * sin;
      const wave = Math.sin(t * 1.55 + p.phase);
      let x = center + mix(spin * radius * (1 + energy * .31), p.sx * width * .49 + wave * 19, spread);
      let y = mix(top + p.y * tall + depth * tall * .135 + wave * energy * 10, height * .52 + p.sy * height + wave * 18, spread);
      let s = p.size * (1 + energy * .57 + depth * .38) * sizeBoost + .28 * spread;
      let alpha = Math.max(.13, Math.min(1, .62 + .22 * wave + .34 * depth + energy * .25));
      if (travel < 1) {
        const progress = Math.max(0, travel);
        const rise = progress * (2 - progress);
        const landing = smoothProgress((progress - .30) / .70);
        const orbit = (t * 7.7 + p.y * tau * 2.25 + p.phase * .73);
        const ring = radius * mix(.87, .20 + p.y * .54, rise) * (.80 + p.phase * .057);
        x = mix(center + Math.cos(orbit) * ring, x, landing);
        y = mix(ground + 12 - (1 - p.y) * tall * rise + Math.sin(orbit) * ring * .24, y, landing);
        s *= mix(1.42, 1, landing);
        alpha = mix(.86, alpha, landing) * smoothProgress((travel + .18) / .26);
      }
      if (forming) ctx.fillStyle = p.index % 17 / 17 < goldRelease ? palette[color] : introPalette[color];
      ctx.globalAlpha = alpha;
      if (shape === 'star' || p.light && shape === 'glow') {
        drawSpark(x, y, s * (p.light ? 2.1 : 1.41), .24);
      } else if (shape === 'diamond') {
        drawSpark(x, y, s * 1.30, 0);
      } else {
        ctx.fillRect(x, y, s, s);
      }
    }
  }
  if (spread < .99) {
    // The garland and prominent ornaments turn with the tree's particle cloud.
    ctx.fillStyle = '#ffe6a0';
    for (const point of garland) {
      const depth = point.z * cos - point.x * sin;
      const x = center + (point.x * cos + point.z * sin) * radius * (1 + energy * .31);
      const y = top + point.y * tall + depth * tall * .138;
      const s = 1.3 + Math.max(0, depth) * 3.1 + energy * 1.4;
      const lit = forming ? smoothProgress((t - (1 - point.y) * spiralTime - .14) / .40) : 1;
      ctx.globalAlpha = lit * (1 - spread) * (.64 + depth * .34);
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
    for (const [y, angle, color] of ornaments) {
      const depth = Math.sin(angle - rotation);
      const x = center + Math.cos(angle - rotation) * y * radius * .94 * (1 + energy * .31);
      const py = top + y * tall + depth * y * tall * .135;
      const size = 2.1 + Math.max(0, depth) * 4 + energy * 2;
      const lit = forming ? smoothProgress((t - (1 - y) * spiralTime - .17) / .43) : 1;
      if (lit === 0) continue;
      const alpha = lit * (1 - spread) * (.50 + .43 * depth);
      drawHalo(x, py, size * 3.4, alpha * .7);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      drawSpark(x, py, size, .25);
    }
    if (forming) drawOpeningSpiral(t, rotation);
    const starLight = forming ? smoothProgress((t - 1.38) / .48) : 1;
    if (starLight > 0) {
      const size = (Math.min(34, Math.max(20, width * .037)) + energy * 8) * mix(.56, 1, starLight);
      drawHalo(center, top - 7, size * 3.1, starLight * .58 * (1 - spread));
      ctx.globalAlpha = starLight * (1 - spread);
      ctx.fillStyle = '#fff8d2';
      starPath(center, top - 7, size, 5, .43);
      ctx.fill();
      ctx.fillStyle = '#eac578';
      starPath(center, top - 7, size * .67, 5, .28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (giftColors[effects.gift] && spread < .99) {
    ctx.globalAlpha = 1 - spread;
    const box = Math.max(23, Math.min(55, radius * .205));
    drawGift(center - radius * .65, ground + 14, box * .9, giftColors[effects.gift]);
    drawGift(center + radius * .39, ground + 26, box * .77, giftColors[effects.gift]);
    drawGift(center - radius * .38, ground + 35, box * .69, giftColors[effects.gift]);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#d8e5d7';
  for (const [x, y, size, speed] of snow) {
    ctx.globalAlpha = .26 + speed * .34;
    const sx = (x * width + Math.sin(t * .25 + y * 20) * 19 + width) % width;
    const sy = (y * height + t * (7 + speed * 18)) % height;
    ctx.fillRect(sx, sy, size, size);
  }
  ctx.globalAlpha = 1;
}

function syncGiftControl() {
  giftTarget.hidden = effects.scattered || effects.gift === 'none';
  giftTarget.dataset.style = effects.gift;
}

function drawSpark(x, y, size, inner) {
  const inset = inner * size;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  if (inner) ctx.lineTo(x + inset, y - inset);
  ctx.lineTo(x + size, y);
  if (inner) ctx.lineTo(x + inset, y + inset);
  ctx.lineTo(x, y + size);
  if (inner) ctx.lineTo(x - inset, y + inset);
  ctx.lineTo(x - size, y);
  if (inner) ctx.lineTo(x - inset, y - inset);
  ctx.fill();
}

function render(now) {
  frame = 0;
  const targetStep = mobile ? 1000 / 30 : 1000 / 60;
  const step = lastFrame ? now - lastFrame : targetStep;
  if (step < targetStep - 2) {
    invalidateScene();
    return;
  }
  if (lastFrame) elapsed += Math.min(step, 100);
  const start = performance.now();
  drawScene(elapsed / 1000, Math.min(step, 100) / 1000);
  lastFrame = now;
  averageCost = mix(averageCost, performance.now() - start, .12);
  averageStep = mix(averageStep || step, step, .12);
  samples++;
  if (samples % 12 === 0 && (averageCost > targetStep * .53 || averageStep > targetStep * 1.38)) {
    particleBudget = Math.max(600, particleBudget - 250);
  } else if (samples % 48 === 0 && averageCost < targetStep * .32 && averageStep < targetStep * 1.19) {
    const ceiling = mobile ? 2400 : maxParticles;
    particleBudget = Math.min(ceiling, particleBudget + 150);
  }
  invalidateScene();
}

function invalidateScene() {
  if (!frame && width && visible && !document.hidden) frame = requestAnimationFrame(render);
}

function updateVisibility() {
  if (!visible || document.hidden) {
    cancelAnimationFrame(frame);
    frame = lastFrame = 0;
    return;
  }
  invalidateScene();
}

document.addEventListener('visibilitychange', updateVisibility);
if (typeof IntersectionObserver !== 'undefined') {
  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    updateVisibility();
  }).observe(canvas);
}
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(canvas);
else window.addEventListener('resize', resize);
resize();

const modelBase = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
const modelUrl = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';

function classifyGesture(result, aspect = 1) {
  const gesture = result.gestures[0]?.[0];
  const hand = result.worldLandmarks?.[0] || result.landmarks[0];
  if (!hand) return null;
  if (gesture?.categoryName === 'Closed_Fist' && gesture.score >= .61) return 'tree';
  const worldCoordinates = Boolean(result.worldLandmarks?.[0]);
  const distance = (a, b) => Math.hypot(
    (hand[a].x - hand[b].x) * (worldCoordinates ? 1 : aspect),
    hand[a].y - hand[b].y,
    worldCoordinates ? hand[a].z - hand[b].z : 0,
  );
  const palm = Math.max(distance(0, 9), distance(5, 17));
  const pinch = palm > 0 && distance(4, 8) / palm < .29;
  if (pinch) return 'photo';
  if (gesture?.categoryName === 'Open_Palm' && gesture.score >= .55) return 'scatter';
  return null;
}

function setupCamera(onGesture) {
  const button = document.querySelector('#camera');
  const label = button.querySelector('span');
  const preview = document.querySelector('#preview');
  const box = document.querySelector('#camera-box');
  const status = document.querySelector('#camera-status');
  const cards = [...document.querySelectorAll('[data-gesture]')];
  const labels = { tree: '已识别握拳', scatter: '已识别摊手', photo: '已识别捏指' };
  let stream, recognizer, frame, generation = 0;
  let candidate = null, lastGesture = null, streak = 0;
  let lastFrame = -Infinity, lastVideoTime = -1, detectionInterval = 75, busy = false;

  function publish(message, action = null) {
    if (status.textContent !== message) status.textContent = message;
    for (const card of cards) card.classList.toggle('active', card.dataset.gesture === action);
  }

  function stop(message = '开启摄像头后，将一只手放在画面内。') {
    generation++;
    cancelAnimationFrame(frame);
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    preview.srcObject = null;
    box.hidden = true;
    busy = false;
    button.removeAttribute('aria-busy');
    label.textContent = '开启摄像头';
    candidate = lastGesture = null;
    streak = 0;
    lastFrame = -Infinity;
    lastVideoTime = -1;
    detectionInterval = 75;
    publish(message);
  }

  function detect(now) {
    if (!stream) return;
    frame = requestAnimationFrame(detect);
    if (now - lastFrame < detectionInterval || preview.readyState < 2 || preview.currentTime === lastVideoTime) return;
    lastFrame = now;
    lastVideoTime = preview.currentTime;
    try {
      const started = performance.now();
      const result = recognizer.recognizeForVideo(preview, now);
      const cost = performance.now() - started;
      detectionInterval = detectionInterval * .85 + Math.max(75, Math.min(240, cost * 3)) * .15;
      const action = classifyGesture(result, preview.videoWidth / preview.videoHeight);
      if (action !== candidate) {
        candidate = action;
        streak = 1;
        return;
      }
      streak++;
      if (streak < 3 || lastGesture === action) return;
      lastGesture = action;
      if (action) {
        publish(labels[action], action);
        onGesture(action);
      } else {
        publish('等待手势 · 握拳、摊手或捏指');
      }
    } catch {
      stop('手势识别已停止，请重新开启摄像头。');
    }
  }

  button.addEventListener('click', async () => {
    if (stream || busy) {
      stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      publish('请通过 HTTPS 或 localhost 打开网页以启用摄像头。');
      return;
    }
    const attempt = ++generation;
    busy = true;
    button.setAttribute('aria-busy', 'true');
    label.textContent = '取消启动';
    publish('等待摄像头权限…');
    try {
      const acquired = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      });
      if (generation !== attempt) {
        acquired.getTracks().forEach(track => track.stop());
        return;
      }
      stream = acquired;
      preview.srcObject = stream;
      stream.getVideoTracks()[0]?.addEventListener('ended', () => {
        if (generation === attempt) stop('摄像头已断开。');
      });
      box.hidden = false;
      publish('正在加载手势模型…');
      await preview.play();
      if (!recognizer) {
        const { FilesetResolver, GestureRecognizer } = await import(modelBase + '/vision_bundle.mjs');
        const vision = await FilesetResolver.forVisionTasks(modelBase + '/wasm');
        const loaded = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
          runningMode: 'VIDEO', numHands: 1,
        });
        if (generation !== attempt) {
          loaded.close();
          return;
        }
        recognizer = loaded;
      }
      if (generation !== attempt) return;
      busy = false;
      button.removeAttribute('aria-busy');
      label.textContent = '关闭摄像头';
      publish('等待手势 · 握拳、摊手或捏指');
      frame = requestAnimationFrame(detect);
    } catch (error) {
      if (generation !== attempt) return;
      const reason = {
        NotAllowedError: '摄像头权限未开启，仍可使用树下按钮。',
        NotFoundError: '未找到摄像头，仍可使用树下按钮。',
        NotReadableError: '摄像头暂不可用，请检查是否被其他应用占用。',
      };
      stop(reason[error.name] || '摄像头或手势模型加载失败，请检查网络后重试。');
    }
  });
  window.addEventListener('pagehide', () => stop());
}

function makeCarol({ notes, beat, measure, chords }) {
  const sampleRate = 22050;
  const beats = notes.reduce((sum, note) => sum + note[1], 0);
  const sampleCount = Math.ceil((beats * beat + .24) * sampleRate);
  const samples = new Float32Array(sampleCount);
  function bell(note, time, duration, volume, bass = false) {
    const f = 440 * Math.pow(2, (note - 69) / 12);
    const start = Math.round(time * sampleRate);
    const count = Math.min(sampleCount - start, Math.ceil(duration * sampleRate));
    for (let i = 0; i < count; i++) {
      const at = i / sampleRate;
      const p = at * Math.PI * 2 * f;
      const envelope = Math.min(1, at / .009, (duration - at) / .09) * Math.exp(-at * (bass ? 3.7 : 4.8));
      const tone = Math.sin(p) + Math.sin(p * 2.01) * .19 + Math.sin(p * 3.01) * .09 * Math.exp(-at * 6);
      samples[start + i] += tone * envelope * volume;
    }
  }
  let time = 0;
  for (const [note, length] of notes) {
    bell(note, time, length * beat + .16, .42);
    time += length * beat;
  }
  for (let i = 0; i < beats; i += measure / 2) {
    const chord = chords[Math.min(chords.length - 1, Math.floor(i / measure))];
    bell(chord + (i % measure ? 7 : 0), i * beat, .63, .24, true);
  }
  const buffer = new ArrayBuffer(44 + sampleCount * 2);
  const view = new DataView(buffer);
  const word = (offset, name) => {
    for (let i = 0; i < name.length; i++) view.setUint8(offset + i, name.charCodeAt(i));
  };
  word(0, 'RIFF');
  view.setUint32(4, buffer.byteLength - 8, true);
  word(8, 'WAVEfmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  word(36, 'data');
  view.setUint32(40, sampleCount * 2, true);
  for (let i = 0; i < sampleCount; i++) {
    view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

function setupMusic(onEnergy) {
  const button = document.querySelector('#play');
  const fileInput = document.querySelector('#music-file');
  const track = document.querySelector('#track');
  const customOption = track.querySelector('option[value=custom]');
  const state = document.querySelector('#track-state');
  const audio = new Audio();
  audio.loop = true;
  let context, analyser, spectrum, sourceUrl, frame, energy = 0;
  let trackVersion = 0;
  let customFile;

  function setSource(blob) {
    audio.pause();
    if (sourceUrl) URL.revokeObjectURL(sourceUrl);
    sourceUrl = blob ? URL.createObjectURL(blob) : null;
    if (sourceUrl) audio.src = sourceUrl;
    else {
      audio.removeAttribute('src');
      audio.load();
    }
    trackVersion++;
  }

  function sample() {
    if (audio.paused) return;
    analyser.getByteFrequencyData(spectrum);
    let level = 0;
    for (let i = 2; i < 29; i++) {
      level += spectrum[i] * (i < 8 ? 1.35 : 1);
    }
    const peak = Math.min(1, level / (255 * 16));
    energy += (peak - energy) * (peak > energy ? .41 : .16);
    onEnergy(energy);
    frame = requestAnimationFrame(sample);
  }

  async function play() {
    if (!sourceUrl) {
      const source = track.value === 'custom' ? customFile : makeCarol(carols[track.value]);
      if (!source) return;
      setSource(source);
    }
    const version = trackVersion;
    try {
      if (!context) {
        context = new AudioContext();
        analyser = context.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = .48;
        spectrum = new Uint8Array(analyser.frequencyBinCount);
        const source = context.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(context.destination);
      }
      await Promise.all([context.resume(), audio.play()]);
    } catch (error) {
      if (version !== trackVersion || error.name === 'AbortError') return;
      audio.pause();
      state.textContent = '无法播放，请选择其他音频或重试。';
    }
  }

  button.addEventListener('click', () => {
    if (audio.paused) void play();
    else audio.pause();
  });
  audio.addEventListener('playing', () => {
    button.textContent = 'Ⅱ';
    button.setAttribute('aria-label', '暂停音乐');
    state.textContent = '正在播放 · 粒子随音乐律动';
    cancelAnimationFrame(frame);
    sample();
  });
  audio.addEventListener('pause', () => {
    button.textContent = '▶';
    button.setAttribute('aria-label', '播放音乐');
    state.textContent = '已暂停';
    cancelAnimationFrame(frame);
    energy = 0;
    onEnergy(0);
  });
  audio.addEventListener('error', () => {
    if (!sourceUrl) return;
    state.textContent = '无法读取这段音频，请重新选择。';
  });
  track.addEventListener('change', () => {
    const resume = !audio.paused;
    setSource(null);
    state.textContent = track.value === 'custom' ? '本地音乐 · 点击播放' : '内置音乐 · 点击播放';
    if (resume) void play();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    customFile = file;
    customOption.hidden = false;
    customOption.textContent = file.name;
    track.value = 'custom';
    setSource(customFile);
    void play();
  });
}


const $ = selector => document.querySelector(selector);
const photos = [];
let currentPhoto = -1;
let settings = {};
try {
  settings = JSON.parse(localStorage.getItem('winter-lights-settings') || '{}') || {};
} catch {}

for (const [id, key] of Object.entries({
  palette: 'palette', shape: 'shape', gift: 'gift', density: 'density', 'custom-color': 'color',
})) {
  const input = document.getElementById(id);
  if (settings[key] != null) input.value = settings[key];
  const apply = () => {
    effects[key] = key === 'density' ? Number(input.value) : input.value;
    $('#density-value').textContent = effects.density;
    $('#color-field').hidden = effects.palette !== 'custom';
    if (key === 'gift') syncGiftControl();
    invalidateScene();
  };
  apply();
  input.addEventListener('input', () => {
    apply();
    settings[key] = effects[key];
    try { localStorage.setItem('winter-lights-settings', JSON.stringify(settings)); } catch {}
  });
}

function setScene(action) {
  effects.scattered = action === 'scatter';
  syncGiftControl();
  for (const button of document.querySelectorAll('[aria-pressed][data-action]')) {
    button.setAttribute('aria-pressed', String(button.dataset.action === action));
  }
  invalidateScene();
}

const database = new Promise((resolve, reject) => {
  try {
    const request = indexedDB.open('winter-lights-album', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('photos', { keyPath: 'id' });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('照片数据库正在使用'));
  } catch (error) { reject(error); }
});
async function transaction(mode, work) {
  const db = await database;
  return new Promise((resolve, reject) => {
    const operation = db.transaction('photos', mode);
    const result = work(operation.objectStore('photos'));
    operation.oncomplete = () => resolve(result?.result);
    operation.onabort = () => reject(operation.error || new Error('相册操作已中止'));
  });
}
function hydrate(record) {
  return { ...record, url: URL.createObjectURL(record.blob) };
}
function renderPhotos() {
  $('#photo-count').textContent = photos.length + ' 张';
  $('#thumbs').replaceChildren(...photos.map((photo, index) => {
    const tile = document.createElement('div');
    tile.className = 'thumb';
    const button = document.createElement('button');
    button.setAttribute('aria-label', '查看 ' + photo.name);
    button.onclick = () => showGiftCard(index);
    const image = document.createElement('img');
    image.src = photo.url;
    image.alt = '';
    button.append(image);
    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.setAttribute('aria-label', '删除 ' + photo.name);
    remove.onclick = async () => {
      remove.disabled = true;
      try {
        if (photo.cached) await transaction('readwrite', store => store.delete(photo.id));
        const index = photos.indexOf(photo);
        if (index !== -1) photos.splice(index, 1);
        URL.revokeObjectURL(photo.url);
        renderPhotos();
        $('#photo-status').textContent = '已移除照片。';
      } catch {
        remove.disabled = false;
        $('#photo-status').textContent = '无法删除照片，请重试。';
      }
    };
    tile.append(button, remove);
    return tile;
  }));
}
const photosReady = transaction('readonly', store => store.getAll()).then(records => {
  records.sort((a, b) => a.added - b.added);
  photos.push(...records.map(record => hydrate({ ...record, cached: true })));
  renderPhotos();
}).catch(() => {
  $('#photo-status').textContent = '浏览器存储不可用，照片仅在本次打开时显示。';
});
$('#photo-file').addEventListener('change', async event => {
  const input = event.target;
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  input.disabled = true;
  await photosReady;
  let added = 0;
  let temporary = 0;
  for (const [index, file] of files.entries()) {
    try {
      const bitmap = await createImageBitmap(file);
      bitmap.close();
    } catch { continue; }
    const record = { id: crypto.randomUUID(), name: file.name, blob: file, added: Date.now() + index };
    let cached = true;
    try {
      await transaction('readwrite', store => store.add(record));
    } catch {
      cached = false;
      temporary++;
    }
    photos.push(hydrate({ ...record, cached }));
    added++;
  }
  renderPhotos();
  const messages = [];
  if (added - temporary) messages.push('已缓存 ' + (added - temporary) + ' 张照片');
  if (temporary) messages.push(temporary + ' 张仅在本次显示');
  if (files.length > added) messages.push(files.length - added + ' 张图片无法读取');
  $('#photo-status').textContent = messages.join('，') + '。';
  input.disabled = false;
});

const dialog = $('#album');
const giftButton = $('#stage-gift');
const greetingCover = $('#open-greeting');
const greetingPicture = $('#greeting-picture');
const largePhoto = $('#large-photo');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let albumRequest = 0;
let giftEntrance, coverTurn, pictureReveal;

function selectPhoto(index) {
  const hasPhotos = photos.length > 0;
  $('#greeting-empty').hidden = hasPhotos;
  largePhoto.hidden = !hasPhotos;
  if (!hasPhotos) return;
  currentPhoto = ((index % photos.length) + photos.length) % photos.length;
  const photo = photos[currentPhoto];
  largePhoto.src = photo.url;
  largePhoto.alt = photo.name;
}

function giftBounds() {
  if (giftButton.hidden) return null;
  const bounds = giftButton.getBoundingClientRect();
  return bounds.bottom > 0 && bounds.top < innerHeight ? bounds : null;
}

function showGiftCard(index) {
  selectPhoto(index);
  if (dialog.open) return;
  const origin = motionPreference.matches ? null : giftBounds();
  if (origin && greetingCover.animate) {
    giftButton.classList.add('is-open');
    dialog.classList.add('gift-opening');
  }
  greetingCover.hidden = false;
  greetingPicture.hidden = true;
  dialog.classList.remove('show-picture');
  dialog.showModal();
  greetingCover.focus({ preventScroll: true });
  if (!origin || !greetingCover.animate) return;

  const card = greetingCover.getBoundingClientRect();
  const left = origin.left + origin.width / 2 - card.left - card.width / 2;
  const top = origin.top + origin.height * .36 - card.top - card.height / 2;
  giftEntrance = greetingCover.animate([
    { transform: `translate(${left}px,${top}px) scale(.09) rotate(-9deg)`, opacity: 0, offset: 0 },
    { transform: `translate(${left}px,${top - 24}px) scale(.18) rotate(-8deg)`, opacity: 1, offset: .27 },
    { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1, offset: 1 },
  ], { duration: 620, easing: 'cubic-bezier(.16,.72,.32,1)' });
}

function showPicture() {
  greetingCover.hidden = true;
  greetingPicture.hidden = false;
  dialog.classList.add('show-picture');
  greetingPicture.focus({ preventScroll: true });
  if (!motionPreference.matches && greetingPicture.animate) {
    pictureReveal = greetingPicture.animate([
      { transform: 'perspective(880px) rotateY(18deg) scale(.94)', opacity: .42 },
      { transform: 'perspective(880px) rotateY(0) scale(1)', opacity: 1 },
    ], { duration: 270, easing: 'ease-out' });
  }
}

function openGreeting() {
  if (!dialog.open || greetingCover.hidden || coverTurn) return;
  giftEntrance?.cancel();
  if (motionPreference.matches || !greetingCover.animate) {
    showPicture();
    return;
  }
  coverTurn = greetingCover.animate([
    { transform: 'perspective(880px) rotateY(0)', transformOrigin: 'left center', opacity: 1 },
    { transform: 'perspective(880px) rotateY(-85deg)', transformOrigin: 'left center', opacity: .35 },
  ], { duration: 235, easing: 'ease-in', fill: 'forwards' });
  coverTurn.onfinish = () => {
    coverTurn.cancel();
    coverTurn = null;
    if (dialog.open) showPicture();
  };
}

function showNextPhoto() {
  const request = ++albumRequest;
  void photosReady.then(() => {
    if (request !== albumRequest) return;
    if (!dialog.open) showGiftCard(currentPhoto + 1);
    else if (!greetingCover.hidden) openGreeting();
  });
}

giftButton.onclick = showNextPhoto;
greetingCover.onclick = openGreeting;
$('#greeting-add').onclick = () => {
  dialog.close();
  $('#photo-panel').scrollIntoView({ block: 'nearest' });
  $('#photo-file').focus({ preventScroll: true });
};
dialog.addEventListener('close', () => {
  giftEntrance?.cancel();
  coverTurn?.cancel();
  pictureReveal?.cancel();
  giftEntrance = coverTurn = pictureReveal = null;
  giftButton.classList.remove('is-open');
  dialog.classList.remove('gift-opening');
});
dialog.addEventListener('click', event => {
  const target = event.target;
  if (target === dialog || target === greetingPicture || target.classList.contains('photo-card')) dialog.close();
});

function act(action, gesture = false) {
  if (action === 'photo') showNextPhoto();
  else {
    albumRequest++;
    if (gesture && dialog.open) dialog.close();
    setScene(action);
  }
}
for (const button of document.querySelectorAll('[data-action]')) {
  button.addEventListener('click', () => act(button.dataset.action));
}

setupCamera(action => act(action, true));
setupMusic(energy => { effects.energy = energy; });

</script>

<body>
<header class="top">
  <a class="brand" href="#scene"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3l2.7 7.2 7.6 2.8-7.6 2.9L16 23l-2.7-7.1L6 13l7.3-2.8L16 3zM25 21v6m-3-3h6M7 20v5m-2.5-2.5h5"/></svg></span><span>冬夜星树 <small>WINTER LIGHTS</small></span></a>
  <button class="camera strong" id="camera"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></svg><span>开启摄像头</span></button>
</header>
<main class="layout">
  <section class="stage" aria-label="互动粒子圣诞树">
    <canvas id="scene"></canvas>
    <div class="stage-heading"><span class="eyebrow">✦ &nbsp; WINTER WONDERLAND</span><h1>圣诞星光</h1><p>Merry Christmas</p></div>
    <div class="stage-status" id="mode"><i></i>星光汇聚中</div>
    <noscript><p class="script-message">请开启 JavaScript 后重新打开星树。</p></noscript>
    <div class="camera-box" id="camera-box" hidden><video id="preview" autoplay playsinline muted></video></div>
    <button id="stage-gift" class="stage-gift" type="button" aria-label="打开树下礼盒" aria-haspopup="dialog" hidden>
      <span class="gift-body" aria-hidden="true"></span><span class="gift-lid" aria-hidden="true"></span>

    <div class="stage-actions" aria-label="手动控制圣诞树">
      <button data-action="tree" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m12 3 5 7h-2l4 6H5l4-6H7l5-7zm0 13v5"/></svg>汇聚</button>
      <button data-action="scatter" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 2v7m0 6v7M2 12h7m6 0h7M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/></svg>散开</button>
      <button data-action="photo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 2-2 7 6"/><circle cx="16" cy="9" r="1"/></svg>照片</button>
    </div>
  </section>
  <aside class="sidebar">
    <section class="panel gestures">
      <h2><span class="section-icon" aria-hidden="true">◎</span>手势控制</h2>
      <div class="gesture-grid">
        <div data-gesture="tree"><svg viewBox="0 0 32 32"><path d="M8 17v-4a2 2 0 0 1 4 0v-2a2 2 0 0 1 4 0v-1a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v7c0 4-3 8-8 8-4 0-7-3-8-7l-2-5a2 2 0 0 1 3-2l4 4h5m-6-4v2m4-3v3m4-3v3"/></svg><b>握拳</b><small>汇聚成树</small></div>
        <div data-gesture="scatter"><svg viewBox="0 0 32 32"><path d="M9 17V9a1.7 1.7 0 0 1 3.4 0v6-9a1.7 1.7 0 0 1 3.4 0v9-10a1.7 1.7 0 0 1 3.4 0v10-7a1.7 1.7 0 0 1 3.4 0v10l2-2a2 2 0 0 1 3 2l-3 6a8.5 8.5 0 0 1-15 .4L5 18a2 2 0 0 1 3-2l1 1z"/></svg><b>摊手</b><small>粒子散开</small></div>
        <div data-gesture="photo"><svg viewBox="0 0 32 32"><path d="M10 17c-2-1-3-4-1-7 2-3 6-4 9-3l4 2a2 2 0 0 1-2 3l-4-1a4 4 0 0 0-3 2c-1 2 0 4 3 4h2l3-3a2 2 0 0 1 3 2l-2 3 4-2a2 2 0 0 1 2 3l-5 4c-2 2-4 3-8 3-5 0-8-3-10-7a2 2 0 0 1 3-2l3 2h4"/><path d="M6 8 4 6m1 6H2"/></svg><b>捏指</b><small>打开礼盒</small></div>
      </div>
      <p class="hint" id="camera-status" aria-live="polite">开启摄像头后，将一只手放在画面内。</p>
    </section>
    <section class="panel settings">
      <h2><span class="section-icon" aria-hidden="true">✧</span>装点星树</h2>
      <div class="field"><label for="palette">粒子配色</label><select id="palette"><option value="pine">松绿暖金</option><option value="frost">冰蓝银白</option><option value="rose">蔷薇粉金</option><option value="custom">自选颜色</option></select></div>
      <div class="field" id="color-field" hidden><label for="custom-color">粒子颜色</label><input type="color" id="custom-color" value="#8fe8af"></div>
      <div class="field"><label for="shape">粒子形状</label><select id="shape"><option value="glow">光点</option><option value="star">星芒</option><option value="diamond">菱形</option></select></div>

      <div class="field range"><label for="density">粒子密度</label><input id="density" type="range" min="600" max="4300" step="100" value="3000"><output id="density-value" for="density">3000</output></div>
    </section>
    <section class="panel music">
      <h2><span class="section-icon" aria-hidden="true">♫</span>音乐律动</h2>
      <div class="player"><button class="play" id="play" type="button" aria-label="播放音乐">▶</button><div><select id="track" aria-label="选择音乐"><option value="jingle">铃儿响叮当</option><option value="silent">平安夜</option><option value="joy">欢乐颂</option><option value="deck">装饰大厅</option><option value="custom" hidden>本地音乐</option></select><small id="track-state">内置音乐 · 点击播放</small></div><label class="upload" for="music-file">本地音乐<input id="music-file" type="file" accept="audio/*"></label></div>
    </section>
    <section class="panel photos" id="photo-panel">
      <h2><span class="section-icon" aria-hidden="true">▧</span>圣诞相册 <span class="photo-count" id="photo-count">0 张</span></h2>
      <div class="thumbs" id="thumbs"></div>
      <label class="upload add" for="photo-file">＋ 添加照片<input id="photo-file" type="file" accept="image/*" multiple></label>
      <p class="hint" id="photo-status" aria-live="polite">照片会保存在当前浏览器。</p>
    </section>
  </aside>
</main>
<dialog id="album" aria-label="圣诞贺卡与相册">
  <div class="photo-card">
    <button id="open-greeting" class="greeting-cover" type="button">
      <span class="greeting-star" aria-hidden="true">✦</span>
      <span class="greeting-english">Merry Christmas</span>
      <span>打开贺卡</span>

  </div>
</dialog>
