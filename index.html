<title>冬夜星树 · Winter Lights</title>
<style>
:root {
  color-scheme: dark;
  font-family: "Microsoft YaHei", system-ui, sans-serif;

}
[hidden] { display: none !important; }
button {

}

svg {

.title-break { display: none; }

.stage-gifts, .floating-memories { position: absolute; inset: 0; pointer-events: none; }
.stage-gift {

  --ribbon: #fff1ce;

  padding: 0;
  border: 0;

  background: transparent;

.stage-gift[data-tone=red] { --paper: #d52a41; }

}
.stage-gift.is-open .gift-lid { transform: translate(20%,-38%) rotate(26deg); }
.stage-gift.is-open::after {
  content: "";
  position: absolute;
  inset: -35% -20% 17%;

.memory-token, .large-gift {

dialog { padding: 0; color: var(--text); }

input:not([type=file]), textarea, select { background: #0d182e; border: 1px solid #a3bbeb4a; color: var(--text); border-radius: 7px; padding: 7px 9px; }

textarea { resize: vertical; }
select { max-width: 100%; font-size: 14px; }

.range output { flex: 0 0 37px; font-size: 12px; text-align: right; }
.gift-library { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 6px; margin-top: 6px; }

small, .hint { color: var(--muted); font-size: 12px; }

.player { display: grid; grid-template-columns: 37px minmax(0,1fr) auto; align-items: center; gap: 7px; }

.add { width: 100%; border-style: dashed; min-height: 36px; }
.photo-count { margin-left: auto; color: var(--muted); font-size: 12px; }
.thumbs { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 7px; max-height: 180px; overflow: auto; }

.thumb { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 7px; }

.download-wish { width: 100%; min-height: 43px; padding: 4px; background: #e5c587; border: 0; color: #221b23; font-size: 15px; font-weight: 700; }
.download-wish:hover { background: #f8daa1; }
#album { width: min(83vw,334px); max-width: calc(100vw - 25px); border: 0; background: transparent; overflow: visible; }

#album.show-picture .photo-card { padding: clamp(6px,1.4vw,12px); border: 1px solid #dcbb7a; border-radius: 12px; background: #c2a575; box-shadow: 0 0 58px #e9c37568,0 25px 75px #0008; }
.greeting-cover { position: relative; width: 100%; min-height: 238px; display: grid; place-items: center; align-content: center; gap: 13px; padding: 25px; border: 1px solid #d6b16a; border-radius: 11px; background: radial-gradient(ellipse at 48% 20%,#453552,#191d3c 57%,#11182c); color: #ffe8b3; box-shadow: 0 24px 50px #0009; backface-visibility: hidden; }
.greeting-cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid #e5c17b73; border-radius: 6px; pointer-events: none; }
.greeting-cover:hover { background: radial-gradient(ellipse at 48% 20%,#5b425a,#25284a 57%,#141b32); }
.greeting-star { font: 45px/1 Georgia,serif; text-shadow: 0 0 23px #ffd57d; }
.greeting-english { font: italic 28px/1.1 Georgia,serif; }
.greeting-cover span:last-child { font-size: 13px; }
#large-photo { display: block; width: auto; max-width: min(82vw,800px); max-height: 78svh; border-radius: 5px; }

<script type="module">

const tau = Math.PI * 2;

  [-.86, -.49, .46, 'cream'], [.91, -.46, .55, 'cream'],

  const button = document.createElement('button');

    sx: random(1.92) - .96, sy: random(.82) - .40, sz: random(1.84) - .92,

const stars = Array.from({length: 195}, () => [random(), random(), random(1.5) + .25, random()]);

const galaxyLights = Array.from({length: 76}, () => [random(tau), .26 + random(.73), random(), random()]);
const winterThemes = {
  forest: [['#06132d','#203f73','#122848'], ['#1c3864','#09152d'], '#101c36', '#fff0c9'],
  cabin: [['#110e27','#563b61','#2e294a'], ['#314264','#11182e'], '#20233e', '#ffe4ae'],
  aurora: [['#060e28','#163f57','#212e55'], ['#1e3d62','#0b1933'], '#111c38', '#e1eee7'],
  dawn: [['#222648','#b47788','#696d9a'], ['#4b5d87','#142840'], '#374361', '#fff0c6'],

const ornaments = [

function drawBackdrop() {

function drawWinterLandscape(paint) {
  const [[zenith, horizon, lowerSky], [snowLight, snowDark], mountains, moonColor] = winterThemes[effects.scenery] || winterThemes.forest;
  const ridge = height * .49;
  const sky = paint.createLinearGradient(0, 0, 0, ridge * 1.16);
  sky.addColorStop(0, zenith);
  sky.addColorStop(.79, horizon);
  sky.addColorStop(1, lowerSky);

  if (effects.scenery === 'aurora') {
    for (let band = 0; band < 5; band++) {
      paint.beginPath();
      paint.moveTo(width * -.05, ridge * (.52 + band * .035));

  const moonY = height * (mobile ? .24 : .19);

  moonGlow.addColorStop(0, '#ffebbcaa');

  moonGlow.addColorStop(1, '#b7c9ff00');
  paint.fillStyle = moonGlow;
  paint.fillRect(moonX - moonSize * 4, moonY - moonSize * 4, moonSize * 8, moonSize * 8);
  paint.fillStyle = moonColor;
  paint.beginPath();
  paint.arc(moonX, moonY, moonSize * .74, 0, tau);
  paint.fill();

  paint.fillStyle = mountains;
  paint.beginPath();
  paint.moveTo(0, height);

    const x = i / 34;

    paint.lineTo(x * width, y);

  snowGround.addColorStop(0, snowDark);

  paint.fillStyle = snowGround;
  paint.beginPath();

  paint.bezierCurveTo(width * .82, ridge * .85, width * .97, ridge * 1.03, width, ridge);
  paint.lineTo(width, height);
  paint.lineTo(0, height);
  paint.fill();

  for (let bank = 0; bank < 20; bank++) {
    const x = ((bank * .273 + .16) % 1) * width;
    const y = ridge + (((bank * .79 + .13) % 1) * .43) * height;
    const size = height * (.014 + ((bank * .153) % 1) * .042);
    paint.save();
    paint.translate(x, y);
    paint.scale(1, .23);
    const reflection = paint.createRadialGradient(0, 0, 0, 0, 0, size);
    reflection.addColorStop(0, '#b9d6ff48');
    reflection.addColorStop(1, '#b9d6ff00');

    const size = height * (.028 + depth * .122);

}

function drawPine(paint, x, foot, size, depth) {
  const shade = depth > .55 ? '#081326' : '#11223c';
  const shadowWidth = size * .51;
  paint.globalAlpha = .24 + depth * .30;
  paint.fillStyle = '#071124';
  paint.beginPath();
  paint.ellipse(x + size * .12, foot, shadowWidth, size * .085, 0, 0, tau);
  paint.fill();
  paint.globalAlpha = 1;

    const peak = foot - size + layer * size * .21;
    const bottom = peak + size * (.43 + layer * .035);
    const half = size * (.12 + layer * .082);
    paint.fillStyle = shade;
    paint.beginPath();
    paint.moveTo(x, peak);
    paint.lineTo(x + half * .87, bottom - size * .036);
    paint.lineTo(x + half, bottom);
    paint.quadraticCurveTo(x + half * .17, bottom + size * .062, x - half, bottom);
    paint.lineTo(x - half * .83, bottom - size * .052);

    paint.strokeStyle = '#9eb8dc55';

function drawCabin(paint, x, y, size) {

  glow.addColorStop(0, '#ffbb596e');
  glow.addColorStop(1, '#ffbb5900');

  paint.fillRect(x - size * 1.3, y - size * 1.45, size * 2.6, size * 2.3);
  paint.fillStyle = '#624342';
  paint.fillRect(x - size * .55, y - size * .51, size * 1.10, size * .51);
  paint.fillStyle = '#22354c';
  paint.beginPath();
  paint.moveTo(x - size * .69, y - size * .49);
  paint.lineTo(x - size * .03, y - size * .91);
  paint.lineTo(x + size * .68, y - size * .49);

  paint.strokeStyle = '#bdcde0';

  paint.fillRect(x + size * .17, y - size * .35, size * .20, size * .15);
  paint.fillStyle = '#302c35';
  paint.fillRect(x - size * .07, y - size * .30, size * .14, size * .30);
}

}

function drawScene(t, dt) {
  if (t >= formationTime || effects.scattered) introFinished = true;
  const forming = !introFinished;
  const status = forming ? '星光汇聚中' : effects.scattered ? '粒子已散开' : '粒子已汇聚';
  if (stageStatus.textContent !== status) stageStatus.textContent = status;
  spread = mix(spread, Number(effects.scattered), 1 - Math.exp(-dt * 3.4));
  const energy = effects.energy;
  orbitAngle = mix(orbitAngle, effects.orbit, 1 - Math.exp(-dt * 6));
  if (backdropTheme !== effects.scenery) drawBackdrop();
  const palette = palettes[effects.palette] || [effects.color, effects.color, effects.color, '#ffe7a0', effects.color, '#fff3d5'];
  ctx.drawImage(backdrop, 0, 0, width, height);
  const rotation = t * .76;
  const cos = Math.cos(rotation);
  const sin = Math.sin(rotation);
  const freeAngle = t * .19 + orbitAngle;
  const freeCos = Math.cos(freeAngle);
  const freeSin = Math.sin(freeAngle);
  const count = Math.min(effects.density, particleBudget);
  const sizeBoost = Math.min(1.48, Math.sqrt(effects.density / count));
  const shape = effects.shape;
  const goldRelease = forming ? smoothProgress((t - 1.51) / .77) : 1;
  drawTreeSilhouette((1 - spread) * (forming ? smoothProgress((t - .70) / 1.1) : 1));
  for (const [color, group] of particlesByColor.entries()) {
    ctx.fillStyle = palette[color];
    for (const p of group) {
      if (p.index >= count) break;
      // Lower rows take flight first, with an orbit that tightens as each row settles.
      const travel = forming ? (t - (1 - p.y) * launchStagger + .11 - p.phase * .021) / .69 : 1;
      if (travel < -.18) continue;
      const spin = p.x * cos + p.z * sin;
      const depth = p.z * cos - p.x * sin;
      const wave = Math.sin(t * 1.55 + p.phase);
      const freeX = (p.sx * freeCos + p.sz * freeSin) * width * .45;
      const freeDepth = p.sz * freeCos - p.sx * freeSin;
      let x = center + mix(spin * radius * (1 + energy * .31), freeX + wave * 15, spread);
      let y = mix(top + p.y * tall + depth * tall * .135 + wave * energy * 10, height * .55 + p.sy * height * .66 + freeDepth * height * .09 + wave * 15, spread);
      let s = p.size * (1 + energy * .57 + depth * .38) * sizeBoost + .40 * spread;
      let alpha = Math.max(.13, Math.min(1, .62 + .22 * wave + .34 * depth + energy * .25));
      if (travel < 1) {
        const progress = Math.max(0, travel);
        const rise = progress * (2 - progress);
        const landing = smoothProgress((progress - .30) / .70);
        const orbit = (t * 7.7 + p.y * tau * 2.25 + p.phase * .73);
        const ring = radius * mix(.87, .20 + p.y * .54, rise) * (.80 + p.phase * .057);
        x = mix(center + Math.cos(orbit) * ring, x, landing);
        y = mix(ground + 12 - (1 - p.y) * tall * rise + Math.sin(orbit) * ring * .24, y, landing);
        s *= mix(1.42, 1, landing);
        alpha = mix(.86, alpha, landing) * smoothProgress((travel + .18) / .26);
      }
      if (forming) ctx.fillStyle = p.index % 17 / 17 < goldRelease ? palette[color] : introPalette[color];
      ctx.globalAlpha = alpha;
      if (shape === 'star' || p.light && shape === 'glow') {
        drawSpark(x, y, s * (p.light ? 2.1 : 1.41), .24);
      } else if (shape === 'diamond') {
        drawSpark(x, y, s * 1.30, 0);
      } else {
        ctx.fillRect(x, y, s, s);
      }
    }
  }
  if (spread > .025) drawGalaxy(t, freeAngle, energy);
  if (spread < .99) {
    // The garland and prominent ornaments turn with the tree's particle cloud.
    ctx.fillStyle = '#ffe6a0';
    for (const [index, point] of garland.entries()) {
      const depth = point.z * cos - point.x * sin;
      const x = center + (point.x * cos + point.z * sin) * radius * (1 + energy * .31);
      const y = top + point.y * tall + depth * tall * .138;
      const s = 1.3 + Math.max(0, depth) * 3.1 + energy * 1.4;
      const lit = forming ? smoothProgress((t - (1 - point.y) * spiralTime - .14) / .40) : 1;
      const flicker = .81 + .19 * Math.sin(t * 2.25 + index * .71);
      const light = lit * (1 - spread) * (.76 + depth * .24) * flicker;
      if (index % 5 === 0 && light > .03) drawHalo(x, y, (5 + s * 5) * (index % 10 ? .85 : 1.22), light * .69);
      ctx.globalAlpha = light;

      const py = top + y * tall + depth * y * tall * .135;
      const size = 2.1 + Math.max(0, depth) * 4 + energy * 2;
      const lit = forming ? smoothProgress((t - (1 - y) * spiralTime - .17) / .43) : 1;

      drawHalo(x, py, size * 3.4, alpha * .7);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      drawSpark(x, py, size, .25);

  }
  {
    const starLight = (1 - .30 * spread) * (forming ? smoothProgress((t - 1.38) / .48) : 1);
    if (starLight > 0) {
      const size = (Math.min(34, Math.max(20, width * .037)) + energy * 8) * mix(.56, 1, starLight);
      drawHalo(center, top - 7, size * 3.5, starLight * .66);
      ctx.globalAlpha = starLight;
      ctx.fillStyle = '#fff8d2';
      starPath(center, top - 7, size, 5, .43);
      ctx.fill();
      ctx.fillStyle = '#eac578';
      starPath(center, top - 7, size * .67, 5, .28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#d8e5d7';
  for (const [x, y, size, speed] of snow) {
    ctx.globalAlpha = .25 + speed * .42;
    const sx = (x * width + Math.sin(t * .25 + y * 20) * 19 + width) % width;
    const sy = (y * height + t * (7 + speed * 18)) % height;
    ctx.fillRect(sx, sy, size, size);
  }
  ctx.globalAlpha = 1;
  layoutGifts(t, freeAngle);
  layoutMemories(t, rotation, freeAngle, forming);
}

function drawTreeSilhouette(opacity) {
  if (opacity < .015) return;
  ctx.globalAlpha = opacity * .67;
  const foliage = ctx.createLinearGradient(center - radius, 0, center + radius, 0);
  foliage.addColorStop(0, '#192b37');
  foliage.addColorStop(.47, '#304b43');
  foliage.addColorStop(1, '#0a2027');
  ctx.fillStyle = foliage;
  for (let tier = 6; tier >= 0; tier--) {
    const level = (tier + 1) / 7;
    const edge = radius * (.15 + .68 * level);
    const y = top + level * tall - 2;
    const tip = y - tall * (.23 + level * .04);
    ctx.beginPath();
    ctx.moveTo(center, Math.max(top, tip));
    ctx.lineTo(center + edge * .84, y - 10);
    ctx.lineTo(center + edge, y);
    ctx.quadraticCurveTo(center + edge * .29, y + level * 21, center - edge, y);
    ctx.lineTo(center - edge * .84, y - 10);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGalaxy(t, angle, energy) {
  const colors = ['#f6cb78','#ff91af','#a6d7ff','#fff5d1'];
  for (let i = 0; i < galaxyLights.length; i++) {
    const [phase, distance, level, speed] = galaxyLights[i];
    const turn = phase + angle * (.60 + distance * .30);
    const depth = (1 + Math.sin(turn)) * .5;
    const x = center + Math.cos(turn) * distance * width * .46;
    const y = height * (.54 + (level - .5) * .41) + (depth - .5) * height * .22;
    const flicker = .60 + Math.sin(t * (1.5 + speed * 2) + phase) * .28;
    const size = (1.35 + depth * 3.3 + energy * 2.1) * flicker;
    if (i % 3 === 0) drawHalo(x, y, size * 4.6, spread * .62);
    ctx.globalAlpha = spread * (.60 + depth * .39) * flicker;
    ctx.fillStyle = colors[i % colors.length];
    if (i % 4 === 0) drawSpark(x, y, size, .27);
    else {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, tau);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function layoutGifts(t, freeAngle) {
  if (giftStage.hidden) return;
  if (spread < .005 && !effects.scattered) {
    if (giftsInFlight) {
      for (const box of stageGifts) box.style.removeProperty('transform');
      giftsInFlight = false;
    }
    return;
  }
  giftsInFlight = true;
  for (const [i, box] of stageGifts.entries()) {
    const [baseX, baseY] = giftAnchors[i];
    const angle = i * 2.40 + freeAngle * .94;
    const depth = Math.sin(angle);
    const distance = .36 + ((i * .317) % .60);
    const x = width * (.50 + Math.cos(angle) * .47 * distance);
    const y = height * (.49 + ((i * .217) % .39) - .20 + depth * .15);
    const dx = (x - baseX) * spread;
    const dy = (y - baseY) * spread - Math.sin(spread * Math.PI) * 24;
    const turn = Math.sin(t * .78 + i * 1.09) * spread * 67;
    box.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) +
      'px,0) rotate(' + turn.toFixed(1) + 'deg) scale(' + mix(1, .64 + depth * .19, spread).toFixed(3) + ')';
  }
}

function layoutMemories(t, rotation, freeAngle, forming) {
  const opacity = forming ? smoothProgress((t - 1.28) / .75) : 1;
  const levelCount = Math.max(8, memoryNodes.length - 1);
  for (const [i, card] of memoryNodes.entries()) {
    const level = .23 + i / levelCount * .65;
    const turn = i * 2.40 - rotation;
    const treeDepth = Math.sin(turn);
    const treeX = center + Math.cos(turn) * radius * Math.pow(level, .90) * .90;
    const treeY = top + level * tall + treeDepth * radius * .16 * level;
    const floatTurn = i * 2.40 + freeAngle * .93;
    const floatDepth = Math.sin(floatTurn);
    const floatDistance = .29 + ((i * .601) % .64);
    const floatX = width * .5 + Math.cos(floatTurn) * width * .46 * floatDistance;
    const floatY = height * (.49 + (level - .44) * .50 + floatDepth * .15);
    const x = mix(treeX, floatX, spread);
    const y = mix(treeY, floatY, spread);
    const depth = mix(treeDepth, floatDepth, spread);
    const scale = .82 + .22 * depth + .30 * spread;
    card.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) +
      'px,0) translate(-50%,-50%) rotate(' + (depth * (7 + 10 * spread)).toFixed(1) +
      'deg) scale(' + scale.toFixed(3) + ')';
    const treeLight = .30 + .70 * smoothProgress((treeDepth + .82) / 1.28);
    card.style.opacity = String(opacity * mix(treeLight, .72 + .28 * Math.max(0, floatDepth), spread));
    card.style.zIndex = String(Math.round(12 + depth * 10));
  }
}

function drawSpark(x, y, size, inner) {
  const inset = inner * size;
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  if (inner) ctx.lineTo(x + inset, y - inset);
  ctx.lineTo(x + size, y);
  if (inner) ctx.lineTo(x + inset, y + inset);
  ctx.lineTo(x, y + size);
  if (inner) ctx.lineTo(x - inset, y + inset);
  ctx.lineTo(x - size, y);
  if (inner) ctx.lineTo(x - inset, y - inset);
  ctx.fill();
}

function render(now) {
  frame = 0;
  const targetStep = mobile ? 1000 / 30 : 1000 / 60;
  const step = lastFrame ? now - lastFrame : targetStep;
  if (step < targetStep - 2) {
    invalidateScene();
    return;
  }
  if (lastFrame) elapsed += Math.min(step, 100);
  const start = performance.now();
  drawScene(elapsed / 1000, Math.min(step, 100) / 1000);
  lastFrame = now;
  averageCost = mix(averageCost, performance.now() - start, .12);
  averageStep = mix(averageStep || step, step, .12);
  samples++;
  if (samples % 12 === 0 && (averageCost > targetStep * .53 || averageStep > targetStep * 1.38)) {
    particleBudget = Math.max(600, particleBudget - 250);
  } else if (samples % 48 === 0 && averageCost < targetStep * .32 && averageStep < targetStep * 1.19) {
    const ceiling = mobile ? 2400 : maxParticles;
    particleBudget = Math.min(ceiling, particleBudget + 150);
  }
  invalidateScene();
}

function invalidateScene() {
  if (!frame && width && visible && !document.hidden) frame = requestAnimationFrame(render);
}

function updateVisibility() {
  if (!visible || document.hidden) {
    cancelAnimationFrame(frame);
    frame = lastFrame = 0;
    return;
  }
  invalidateScene();
}

  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;

else window.addEventListener('resize', resize);

const modelUrl = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';

function classifyGesture(result, aspect = 1) {
  const gesture = result.gestures[0]?.[0];
  const hand = result.worldLandmarks?.[0] || result.landmarks[0];
  if (!hand) return null;
  if (gesture?.categoryName === 'Closed_Fist' && gesture.score >= .61) return 'tree';
  const worldCoordinates = Boolean(result.worldLandmarks?.[0]);
  const distance = (a, b) => Math.hypot(
    (hand[a].x - hand[b].x) * (worldCoordinates ? 1 : aspect),
    hand[a].y - hand[b].y,
    worldCoordinates ? hand[a].z - hand[b].z : 0,
  );
  const palm = Math.max(distance(0, 9), distance(5, 17));
  const pinch = palm > 0 && distance(4, 8) / palm < .29;
  if (pinch) return 'photo';
  if (gesture?.categoryName === 'Open_Palm' && gesture.score >= .55) return 'scatter';
  return null;
}

function setupCamera(onGesture, onPosition) {
  const button = document.querySelector('#camera');
  const label = button.querySelector('span');
  const preview = document.querySelector('#preview');
  const box = document.querySelector('#camera-box');
  const status = document.querySelector('#camera-status');
  const cards = [...document.querySelectorAll('[data-gesture]')];
  const labels = { tree: '已识别握拳', scatter: '已识别摊手', photo: '已识别捏指' };
  let stream, recognizer, frame, generation = 0;
  let candidate = null, lastGesture = null, streak = 0;
  let lastFrame = -Infinity, lastVideoTime = -1, detectionInterval = 75, busy = false;

  function publish(message, action = null) {
    if (status.textContent !== message) status.textContent = message;
    for (const card of cards) card.classList.toggle('active', card.dataset.gesture === action);
  }

  function stop(message = '开启摄像头后，将一只手放在画面内。') {
    generation++;
    cancelAnimationFrame(frame);
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    preview.srcObject = null;
    box.hidden = true;
    busy = false;
    button.removeAttribute('aria-busy');
    label.textContent = '开启摄像头';
    candidate = lastGesture = null;
    streak = 0;
    lastFrame = -Infinity;
    lastVideoTime = -1;
    detectionInterval = 75;
    publish(message);
  }

  function detect(now) {
    if (!stream) return;
    frame = requestAnimationFrame(detect);
    if (now - lastFrame < detectionInterval || preview.readyState < 2 || preview.currentTime === lastVideoTime) return;
    lastFrame = now;
    lastVideoTime = preview.currentTime;
    try {
      const started = performance.now();
      const result = recognizer.recognizeForVideo(preview, now);
      onPosition?.(result.landmarks[0]?.[9]?.x ?? null);
      const cost = performance.now() - started;
      detectionInterval = detectionInterval * .85 + Math.max(75, Math.min(240, cost * 3)) * .15;
      const action = classifyGesture(result, preview.videoWidth / preview.videoHeight);
      if (action !== candidate) {
        candidate = action;
        streak = 1;
        return;
      }
      streak++;
      if (streak < 3 || lastGesture === action) return;
      lastGesture = action;
      if (action) {
        publish(labels[action], action);
        onGesture(action);
      } else {
        publish('等待手势 · 握拳、摊手或捏指');
      }
    } catch {
      stop('手势识别已停止，请重新开启摄像头。');
    }
  }

  button.addEventListener('click', async () => {
    if (stream || busy) {
      stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      publish('请通过 HTTPS 或 localhost 打开网页以启用摄像头。');
      return;
    }
    const attempt = ++generation;
    busy = true;
    button.setAttribute('aria-busy', 'true');
    label.textContent = '取消启动';
    publish('等待摄像头权限…');
    try {
      const acquired = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      });
      if (generation !== attempt) {
        acquired.getTracks().forEach(track => track.stop());
        return;
      }
      stream = acquired;
      preview.srcObject = stream;
      stream.getVideoTracks()[0]?.addEventListener('ended', () => {
        if (generation === attempt) stop('摄像头已断开。');
      });
      box.hidden = false;
      publish('正在加载手势模型…');
      await preview.play();
      if (!recognizer) {
        const { FilesetResolver, GestureRecognizer } = await import(modelBase + '/vision_bundle.mjs');
        const vision = await FilesetResolver.forVisionTasks(modelBase + '/wasm');
        const loaded = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
          runningMode: 'VIDEO', numHands: 1,
        });
        if (generation !== attempt) {
          loaded.close();
          return;
        }
        recognizer = loaded;
      }
      if (generation !== attempt) return;
      busy = false;
      button.removeAttribute('aria-busy');
      label.textContent = '关闭摄像头';
      publish('等待手势 · 握拳、摊手或捏指');
      frame = requestAnimationFrame(detect);
    } catch (error) {
      if (generation !== attempt) return;
      const reason = {
        NotAllowedError: '摄像头权限未开启，仍可使用树下按钮。',
        NotFoundError: '未找到摄像头，仍可使用树下按钮。',
        NotReadableError: '摄像头暂不可用，请检查是否被其他应用占用。',
      };
      stop(reason[error.name] || '摄像头或手势模型加载失败，请检查网络后重试。');
    }
  });
  window.addEventListener('pagehide', () => stop());
}

const builtinSongs = {

function setupMusic(onEnergy) {
  const button = document.querySelector('#play');
  const fileInput = document.querySelector('#music-file');
  const track = document.querySelector('#track');
  const customOption = track.querySelector('option[value=custom]');
  const state = document.querySelector('#track-state');
  const audio = new Audio();
  audio.loop = true;
  audio.preload = 'none';
  audio.crossOrigin = 'anonymous';
  let context, analyser, spectrum, sourceUrl, objectUrl, frame, energy = 0;
  let trackVersion = 0;
  let customFile;

  function setSource() {
    audio.pause();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = null;
    sourceUrl = null;
    if (track.value === 'custom') {
      if (customFile) sourceUrl = objectUrl = URL.createObjectURL(customFile);
    } else if (builtinSongs[track.value]) {
      const base = location.protocol === 'file:' ? 'https://cloud789922.github.io/1/' : location.href;
      sourceUrl = new URL(builtinSongs[track.value], base).href;
    }
    if (sourceUrl) audio.src = sourceUrl;
    else {
      audio.removeAttribute('src');
      audio.load();
    }
    trackVersion++;
  }

  function sample() {
    if (audio.paused) return;
    analyser.getByteFrequencyData(spectrum);
    let level = 0;
    for (let i = 2; i < 29; i++) {
      level += spectrum[i] * (i < 8 ? 1.35 : 1);
    }
    const peak = Math.min(1, level / (255 * 16));
    energy += (peak - energy) * (peak > energy ? .41 : .16);
    onEnergy(energy);
    frame = requestAnimationFrame(sample);
  }

  async function play() {
    if (!sourceUrl) setSource();
    if (!sourceUrl) return;
    const version = trackVersion;
    try {
      if (!context) {
        context = new AudioContext();
        analyser = context.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = .48;
        spectrum = new Uint8Array(analyser.frequencyBinCount);
        const source = context.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(context.destination);
      }
      await Promise.all([context.resume(), audio.play()]);
    } catch (error) {
      if (version !== trackVersion || error.name === 'AbortError') return;
      audio.pause();
      state.textContent = '无法播放，请选择其他音频或重试。';
    }
  }

  button.addEventListener('click', () => {
    if (audio.paused) void play();
    else audio.pause();
  });
  audio.addEventListener('playing', () => {
    button.textContent = 'Ⅱ';
    button.setAttribute('aria-label', '暂停音乐');
    state.textContent = '正在播放 · 粒子随音乐律动';
    cancelAnimationFrame(frame);
    sample();
  });
  audio.addEventListener('pause', () => {
    if (!audio.paused) return;
    button.textContent = '▶';
    button.setAttribute('aria-label', '播放音乐');
    state.textContent = '已暂停';
    cancelAnimationFrame(frame);
    energy = 0;
    onEnergy(0);
  });
  audio.addEventListener('error', () => {
    if (!sourceUrl) return;
    state.textContent = '无法读取这段音频，请重新选择。';
  });
  track.addEventListener('change', () => {
    const resume = !audio.paused;
    setSource();
    state.textContent = track.value === 'custom' ? '本地音乐 · 点击播放' : '内置音乐 · 点击播放';
    if (resume) void play();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    customFile = file;
    customOption.hidden = false;
    customOption.textContent = file.name;
    track.value = 'custom';
    setSource();
    void play();
  });
}

  renderPhotos();
  const messages = [];
  if (added - temporary) messages.push('已缓存 ' + (added - temporary) + ' 张照片');
  if (temporary) messages.push(temporary + ' 张仅在本次显示');
  if (files.length > added) messages.push(files.length - added + ' 张图片无法读取');
  $('#photo-status').textContent = messages.join('，') + '。';
  input.disabled = false;
});

const dialog = $('#album');
const greetingCover = $('#open-greeting');
const greetingPicture = $('#greeting-picture');
const largePhoto = $('#large-photo');
const largeGift = $('#large-gift');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let albumRequest = 0;
let giftEntrance, coverTurn, pictureReveal;
let openGift, previousGift;
let nextGiftIndex = 0;

function setPicture(entry) {
  $('#greeting-empty').hidden = Boolean(entry);
  largePhoto.hidden = !entry?.photo;
  largeGift.hidden = !entry || Boolean(entry.photo);
  if (entry?.photo) {
    largePhoto.src = entry.photo.url;
    largePhoto.alt = entry.name;
  } else if (entry) {
    largeGift.querySelector('span').textContent = entry.icon;
    largeGift.querySelector('strong').textContent = entry.name;
  }
}

function nextMemory(index) {
  if (photos.length) {
    currentPhoto = ((index % photos.length) + photos.length) % photos.length;
    const photo = photos[currentPhoto];
    return { photo, name: photo.name };
  }
  const gifts = selectedGifts();
  if (gifts.length) {
    const [icon, name] = gifts[nextGiftIndex++ % gifts.length];
    return { icon, name };
  }
  return null;
}

function showMemoryEntry(entry, origin) {
  if (dialog.open) return;
  setPicture(entry);
  greetingCover.hidden = true;
  dialog.showModal();
  showPicture(origin);
}

function chooseGift(requestedGift) {
  if (effects.scattered) return;
  const candidates = (requestedGift ? [requestedGift] : stageGifts)
    .map(button => ({ button, bounds: button.getBoundingClientRect() }))
    .filter(({ bounds }) => bounds.width && bounds.top + bounds.height * .36 > 0 &&
      bounds.top + bounds.height * .36 < innerHeight);
  const fresh = candidates.filter(({ button }) => button !== previousGift);
  const available = fresh.length ? fresh : candidates;
  return available[Math.floor(Math.random() * available.length)];
}

function showGiftCard(index, requestedGift) {
  if (dialog.open) return;
  setPicture(nextMemory(index));
  const chosen = chooseGift(requestedGift);
  const origin = motionPreference.matches ? null : chosen?.bounds;
  if (chosen) {
    openGift = previousGift = chosen.button;
    openGift.classList.add('is-open');
  }
  if (origin && greetingCover.animate) {
    dialog.classList.add('gift-opening');
  }
  greetingCover.hidden = false;
  greetingPicture.hidden = true;
  dialog.classList.remove('show-picture');
  dialog.showModal();
  greetingCover.focus({ preventScroll: true });
  if (!origin || !greetingCover.animate) return;

  const card = greetingCover.getBoundingClientRect();
  const left = origin.left + origin.width / 2 - card.left - card.width / 2;
  const top = origin.top + origin.height * .46 - card.top - card.height / 2;
  giftEntrance = greetingCover.animate([
    { transform: `translate(${left}px,${top}px) scale(.09) rotate(-9deg)`, opacity: 0, offset: 0 },
    { transform: `translate(${left}px,${top - 24}px) scale(.18) rotate(-8deg)`, opacity: 1, offset: .27 },
    { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1, offset: 1 },
  ], { duration: 620, easing: 'cubic-bezier(.16,.72,.32,1)' });
}

function showPicture(origin) {
  greetingCover.hidden = true;
  greetingPicture.hidden = false;
  dialog.classList.add('show-picture');
  greetingPicture.focus({ preventScroll: true });
  if (!motionPreference.matches && greetingPicture.animate) {
    let start = { transform: 'perspective(880px) rotateY(18deg) scale(.94)', opacity: .42 };
    if (origin) {
      const revealed = greetingPicture.getBoundingClientRect();
      const x = origin.left + origin.width / 2 - revealed.left - revealed.width / 2;
      const y = origin.top + origin.height / 2 - revealed.top - revealed.height / 2;
      const scale = origin.width / revealed.width;
      start = { transform: `translate(${x}px,${y}px) rotate(-6deg) scale(${scale})`, opacity: .8 };
    }
    pictureReveal = greetingPicture.animate([
      start,
      { transform: 'perspective(880px) rotateY(0) scale(1)', opacity: 1 },
    ], { duration: origin ? 440 : 270, easing: 'cubic-bezier(.2,.72,.26,1)' });
  }
}

function openGreeting() {
  if (!dialog.open || greetingCover.hidden || coverTurn) return;
  giftEntrance?.cancel();
  if (motionPreference.matches || !greetingCover.animate) {
    showPicture();
    return;
  }
  coverTurn = greetingCover.animate([
    { transform: 'perspective(880px) rotateY(0)', transformOrigin: 'left center', opacity: 1 },
    { transform: 'perspective(880px) rotateY(-85deg)', transformOrigin: 'left center', opacity: .35 },
  ], { duration: 235, easing: 'ease-in', fill: 'forwards' });
  coverTurn.onfinish = () => {
    coverTurn.cancel();
    coverTurn = null;
    if (dialog.open) showPicture();
  };
}

function showNextPhoto(requestedGift) {
  const request = ++albumRequest;
  void photosReady.then(() => {
    if (request !== albumRequest) return;
    if (!dialog.open) showGiftCard(currentPhoto + 1, requestedGift);
    else if (!greetingCover.hidden) openGreeting();
  });
}

for (const gift of stageGifts) gift.onclick = () => showNextPhoto(gift);
greetingCover.onclick = openGreeting;
$('#greeting-add').onclick = () => {
  dialog.close();
  studio.showModal();
  $('#photo-panel').scrollIntoView({ block: 'nearest' });
  $('#photo-file').focus({ preventScroll: true });
};
dialog.addEventListener('close', () => {
  giftEntrance?.cancel();
  coverTurn?.cancel();
  pictureReveal?.cancel();
  giftEntrance = coverTurn = pictureReveal = null;
  openGift?.classList.remove('is-open');
  openGift = null;
  dialog.classList.remove('gift-opening');
});
dialog.addEventListener('click', event => {
  const target = event.target;
  if (target === dialog || target === greetingPicture || target.classList.contains('photo-card')) dialog.close();
});

function act(action, gesture = false) {
  if (action === 'photo') {
    if (effects.scattered && !dialog.open) openNearestMemory();
    else showNextPhoto();
  }
  else {
    albumRequest++;
    if (gesture && dialog.open) dialog.close();
    setScene(action);
  }
}
for (const button of document.querySelectorAll('[data-action]')) {
  button.addEventListener('click', () => act(button.dataset.action));
}

function openNearestMemory() {
  const targetX = innerWidth * .50;
  const targetY = innerHeight * .53;
  const cards = [...$('#floating-memories').children];
  let closest, distance = Infinity;
  for (const card of cards) {
    const box = card.getBoundingClientRect();
    const offset = Math.hypot(box.left + box.width / 2 - targetX, box.top + box.height / 2 - targetY);
    if (offset < distance) {
      closest = card;
      distance = offset;
    }
  }
  if (closest) closest.click();
  else showNextPhoto();
}

const roomCanvas = $('#scene');
let drag;
roomCanvas.addEventListener('pointerdown', event => {
  if (!effects.scattered || event.button !== 0) return;
  drag = { id: event.pointerId, x: event.clientX };
  roomCanvas.setPointerCapture(event.pointerId);
});
roomCanvas.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  effects.orbit += (event.clientX - drag.x) * .006;
  drag.x = event.clientX;
  invalidateScene();
});
roomCanvas.addEventListener('lostpointercapture', () => { drag = null; });

let handX = null;
setupCamera(action => {
  if (!studio.open) act(action, true);
}, position => {
  if (effects.scattered && !studio.open && !dialog.open && position !== null && handX !== null) {
    const movement = position - handX;
    if (Math.abs(movement) > .005) effects.orbit -= movement * 5.2;
  }
  handX = position;
});
const cameraStatus = $('#camera-status');
const cameraFeedback = $('#camera-feedback');
new MutationObserver(() => {
  cameraFeedback.textContent = cameraStatus.textContent;
  cameraFeedback.hidden = false;
}).observe(cameraStatus, { childList: true, characterData: true, subtree: true });

$('#open-studio').onclick = () => studio.showModal();
$('#open-music').onclick = () => {
  studio.showModal();
  $('#music-panel').scrollIntoView({ block: 'nearest' });
  $('#music-panel').focus({ preventScroll: true });
};
$('#close-studio').onclick = () => studio.close();
const fullscreenButton = $('#fullscreen');
if (document.fullscreenEnabled && stage.requestFullscreen) {
  fullscreenButton.hidden = false;
  fullscreenButton.onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {}
  };
  document.addEventListener('fullscreenchange', () => {
    fullscreenButton.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });
}
studio.addEventListener('click', event => {
  const bounds = studio.getBoundingClientRect();
  if (event.target === studio && (event.clientX < bounds.left || event.clientX > bounds.right)) studio.close();
});

const trackSelect = $('#track');
if ([...trackSelect.options].some(option => option.value === settings.track && !option.hidden)) trackSelect.value = settings.track;
trackSelect.addEventListener('change', () => {
  if (trackSelect.value !== 'custom') {
    settings.track = trackSelect.value;
    saveSettings();
  }
});
setupMusic(energy => { effects.energy = energy; });

function readPhotoData(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function exportWish() {
  const snapshot = documentShell.cloneNode(true);
  snapshot.querySelector('#stage-gifts').replaceChildren();
  snapshot.querySelector('#wish-data')?.remove();
  const moduleScript = snapshot.querySelector('head script[type=module]');
  if (moduleScript.hasAttribute('src')) {
    const files = ['scene.js', 'camera.js', 'music.js', 'app.js', 'style.css'];
    const loaded = await Promise.all(files.map(async name => {
      const response = await fetch('./' + name);
      if (!response.ok) throw new Error('Could not load ' + name);
      return response.text();
    }));
    const css = document.createElement('style');
    css.textContent = loaded.pop();
    snapshot.querySelector('head link[rel=stylesheet]').replaceWith(css);
    moduleScript.removeAttribute('src');
    moduleScript.textContent = loaded.map(source => source
      .replace(/^import .*;\r?\n/gm, '')
      .replace(/^export (?=const |function )/gm, '')).join('\n');
  }
  const data = document.createElement('script');
  data.id = 'wish-data';
  data.type = 'application/json';
  const packaged = await Promise.all(photos.map(async photo => ({ name: photo.name, data: await readPhotoData(photo.blob) })));
  data.textContent = JSON.stringify({ id: crypto.randomUUID(), settings, photos: packaged }).replace(/</g, '\\u003c');
  moduleScript.before(data);
  const file = new Blob(['<!doctype html>\n' + snapshot.outerHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(file);
  const download = document.createElement('a');
  download.href = url;
  download.download = '我的冬夜星树.html';
  download.click();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

const shareButton = $('#download-wish');
shareButton.onclick = async () => {
  shareButton.disabled = true;
  $('#share-status').textContent = '正在准备网页文件…';
  try {
    await photosReady;
    await exportWish();
    $('#share-status').textContent = '专属网页已生成。';
  } catch {
    $('#share-status').textContent = '生成失败，请重新尝试。';
  } finally {
    shareButton.disabled = false;
  }
};

</script>

    </select><button id="fullscreen" type="button" hidden>全屏</button></div>

    <div class="stage-actions" role="group" aria-label="手动控制圣诞树">

      <button data-action="scatter" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 2v7m0 6v7M2 12h7m6 0h7M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/></svg>散开</button>
      <button data-action="photo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 2-2 7 6"/><circle cx="16" cy="9" r="1"/></svg>照片</button>
          <button id="camera" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></svg><span>手势</span></button>
      <button id="open-music" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M9 17V6l10-2v11M9 17c0 2-5 3-5 1s5-3 5-1zm10-2c0 2-5 3-5 1s5-3 5-1z"/></svg>音乐</button>
      <button id="open-studio" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg>装扮</button>
    </div>
    <div id="camera-feedback" class="camera-feedback" aria-live="polite" hidden></div>
  </section>
</main>
<dialog id="studio" class="studio" aria-labelledby="studio-title">
  <header class="studio-header"><div><small>冬夜星树</small><h2 id="studio-title">装扮与祝福</h2></div><button id="close-studio" type="button" aria-label="关闭装扮">×</button></header>
  <div class="sidebar">
    <section class="panel">

        <label>送给<input id="recipient" maxlength="28" placeholder="收礼人的名字"></label>

    <section class="panel gestures">
      <h2><span class="section-icon" aria-hidden="true">◎</span>手势控制</h2>
      <div class="gesture-grid">
        <div data-gesture="tree"><svg viewBox="0 0 32 32"><path d="M8 17v-4a2 2 0 0 1 4 0v-2a2 2 0 0 1 4 0v-1a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v7c0 4-3 8-8 8-4 0-7-3-8-7l-2-5a2 2 0 0 1 3-2l4 4h5m-6-4v2m4-3v3m4-3v3"/></svg><b>握拳</b><small>汇聚成树</small></div>
        <div data-gesture="scatter"><svg viewBox="0 0 32 32"><path d="M9 17V9a1.7 1.7 0 0 1 3.4 0v6-9a1.7 1.7 0 0 1 3.4 0v9-10a1.7 1.7 0 0 1 3.4 0v10-7a1.7 1.7 0 0 1 3.4 0v10l2-2a2 2 0 0 1 3 2l-3 6a8.5 8.5 0 0 1-15 .4L5 18a2 2 0 0 1 3-2l1 1z"/></svg><b>摊手</b><small>粒子散开</small></div>
        <div data-gesture="photo"><svg viewBox="0 0 32 32"><path d="M10 17c-2-1-3-4-1-7 2-3 6-4 9-3l4 2a2 2 0 0 1-2 3l-4-1a4 4 0 0 0-3 2c-1 2 0 4 3 4h2l3-3a2 2 0 0 1 3 2l-2 3 4-2a2 2 0 0 1 2 3l-5 4c-2 2-4 3-8 3-5 0-8-3-10-7a2 2 0 0 1 3-2l3 2h4"/><path d="M6 8 4 6m1 6H2"/></svg><b>捏指</b><small>查看礼物</small></div>
      </div>
      <p class="hint" id="camera-status" aria-live="polite">开启摄像头后，将一只手放在画面内。</p>

      <div class="field"><label for="gift">礼盒样式</label><select id="gift"><option value="classic">绯红金缎</option><option value="ice">冰蓝银缎</option><option value="pink">莓粉丝带</option><option value="none">隐藏礼盒</option></select></div>
      <div class="field range"><label for="density">粒子密度</label><input id="density" type="range" min="600" max="4300" step="100" value="3000"><output id="density-value" for="density">3000</output></div>
    </section>
    <section class="panel music" id="music-panel" tabindex="-1">
      <h2><span class="section-icon" aria-hidden="true">♫</span>音乐律动</h2>
