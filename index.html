function snowHill(paint, y, amplitude, phase, fill) {

function drawWinterLandscape(paint) {
  const [[zenith, horizon, lowerSky], [snowLight, snowDark], mountains, moonColor] = winterThemes[effects.scenery] || winterThemes.forest;

  if (effects.scenery === 'aurora') drawAurora(paint, ridge);

  const haze = paint.createLinearGradient(0, ridge * .91, 0, height * .70);

  snowHill(paint, ridge - height * .01, height * .026, .05, haze);

  snowHill(paint, ridge + height * .045, height * .040, .84, terrain);
  const foreground = paint.createLinearGradient(0, height * .60, 0, height);

  foreground.addColorStop(1, '#030d2d32');
  snowHill(paint, height * .665, height * .060, 2.42, foreground);

    softPatch(paint, px + span * .21, py + span * .059, span * 1.22, span * .22, '#061633', .21, -.10);
    softPatch(paint, px, py, span, span * .19, color, (.16 + extent * .17) * (i % 4 ? 1 : .68), -.10);
    for (let j = 0; j < 4; j++) {
      const dx = ((i * .27 + j * .31) % 1 - .5) * span * 1.6;
      const dy = ((i * .77 + j * .37) % 1 - .5) * span * .35;
      const size = .4 + ((i * .39 + j * .49) % 1) * 1.02;
      paint.fillStyle = '#dfeeff';
      paint.globalAlpha = .19 + size * .29;
      paint.fillRect(px + dx, py + dy, size, size);
      if (size > 1.12) softPatch(paint, px + dx, py + dy, size * 4.3, size * 3.8, color, .27);
    }
  }
  paint.globalAlpha = 1;

  for (const [x, depth, scale] of forestTrees) {
    const foot = ridge + height * (.006 + depth * .268);

  paint.fillRect(0, 0, width, height);
}

function drawSleighFlight(t) {
  if (reducedSceneMotion.matches) return;
  if (sleighFlight && t >= sleighFlight.end) {

  const size = Math.min(93, Math.max(38, width * .079));

function starPath(x, y, r, arms = 4, inner = .24) {
  ctx.beginPath();
  for (let i = 0; i < arms * 2; i++) {
    const angle = i * Math.PI / arms - Math.PI / 2;
    const length = i % 2 ? r * inner : r;
    const px = x + Math.cos(angle) * length;
    const py = y + Math.sin(angle) * length;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function frontFacing(points) {
  const [a, b, c] = points;
  return (b.x - a.x) * (c.y - a.y) > (b.y - a.y) * (c.x - a.x);

function addFoliage(t, forming) {

const ambientLights = Array.from({ length: 61 }, (_, i) => {

function addGarland(t, forming, energy) {
  const count = 236;
  const head = forming ? Math.min(1, t / 2.10) : 1;
  let previous;
  for (let i = 0; i <= Math.floor(count * head); i++) {
    const progress = i / count;
    const angle = -progress * tau * 7.3;
    const distance = treeRadius * (1 - progress) ** .89 * 1.03;
    const point = project(Math.cos(angle) * distance, .11 + progress * 5.04, Math.sin(angle) * distance);
    if (previous) {
      worldItems.push({ depth: (previous.depth + point.depth) / 2, segment: [previous, point], opacity: mix(.79, .16, spread) });
    }
    if (i % 4 === 0 && spread < .98) {
      const flare = .7 + .30 * Math.sin(i * 2.31 + t * 2.5);
      const nearHead = forming && head - progress < .045;
      queueLight(point, '#fff2c1', (nearHead ? 3.4 : 1.3 + flare + energy) * point.scale / worldScale, 1 - spread, nearHead || i % 12 === 0);
    }
    previous = point;
  }
  if (forming && previous) queueLight(previous, '#fff6dd', 5.9, 1 - spread, true, 'star');
  for (const [i, light] of ambientLights.entries()) {
    const alpha = (1 - spread) * (forming ? smoothProgress((t - (light.y / treeHeight) * 1.62) / .40) : 1);
    if (alpha < .025) continue;
    const point = project(light.x, light.y, light.z);
    const pulse = .79 + .21 * Math.sin(light.phase + t * 2.3);
    queueLight(point, ['#ffb4c5', '#ffe2a0', '#fff6dd'][i % 3],

function addParticles(t, forming, energy) {
  const palette = palettes[effects.palette] || [effects.color, effects.color, effects.color, '#ffe7a0', effects.color, '#fff3d5'];
  const count = Math.min(effects.density, particleBudget);
  const boost = Math.min(1.47, Math.sqrt(effects.density / count));
  for (let i = 0; i < count; i++) {
    const p = particles[i];
    const sparkle = .70 + .29 * Math.sin(p.phase + t * 1.7);
    const angle = p.angle + t * (.12 + .1 / p.galaxy);
    let x = mix(p.x * (1 + energy * .12), Math.cos(angle) * p.galaxy * galaxyWidth, spread);
    let z = mix(p.z * (1 + energy * .12), Math.sin(angle) * p.galaxy * galaxyWidth, spread);
    let y = mix(treeHeight * (1 - p.level), p.height + Math.sin(t + p.phase) * .16, spread);
    let opacity = sparkle;
    if (forming) {
      const travel = (t - (1 - p.level) * 1.26 - p.phase * .029) / 1.04;
      if (travel < -.03) continue;
      if (travel < 1) {
        const rise = smoothProgress(travel);
        const settle = smoothProgress((travel - .24) / .76);
        const spiral = t * 8.9 + p.level * 13 + p.phase * .48;
        const distance = mix(treeRadius * .94, Math.hypot(p.x, p.z), rise);
        x = mix(Math.cos(spiral) * distance, x, settle);
        z = mix(Math.sin(spiral) * distance, z, settle);
        y = mix(.07, y, rise);
        opacity *= smoothProgress((travel + .03) / .20);
      }
    }
    const point = project(x, y, z);
    if (point.x < -10 || point.x > width + 10 || point.y < -10 || point.y > height + 10) continue;
    const light = p.light || spread > .5 && i % 31 === 0;
    const colors = forming && t < 1.87 ? introPalette : palette;
    const color = spread > .65 && i % 11 === 0 ? '#ff9cba' :
      i % 3 === 0 && effects.palette === 'pine' ? '#fff6dd' : colors[p.color];
    const size = (p.size * boost + spread * .31 + (light ? 1.6 : 0)) * (1 + energy * .45) * point.scale / worldScale;
    queueLight(point, color, size, opacity * (light ? 1 : .82), light, effects.shape);
  }
}

function addStar(t, forming) {
  const glow = (forming ? smoothProgress((t - 1.82) / .53) : 1) * (1 - spread * .28);
  if (glow <= 0) return;
  const centerPoint = project(0, 5.40, 0);

  const cos = Math.cos(angle);

function worldPose(x, y, z, yaw, pitch = 0, roll = 0) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const p = Math.cos(pitch), q = Math.sin(pitch);
  const r = Math.cos(roll), k = Math.sin(roll);
  return (u, v, w) => {
    const localY = v * p - w * q;
    const localZ = w * p + v * q;
    const localX = u * r - localY * k;
    return project(x + localX * c + localZ * s, y + localY * r + u * k, z + localZ * c - localX * s);
  };
}

const cuboidFaces = [
  [3, 2, 1, 0, 0, 0], [2, 6, 5, 1, 0, .41], [6, 7, 4, 5, 0, .29],

function paintBox(pose, halfX, halfZ, base, top, paper, ribbons, opacity = 1) {
  const corners = [
    [-halfX, base, halfZ], [halfX, base, halfZ], [halfX, top, halfZ], [-halfX, top, halfZ],
    [-halfX, base, -halfZ], [halfX, base, -halfZ], [halfX, top, -halfZ], [-halfX, top, -halfZ],
  ].map(point => pose(...point));
  for (const [a, b, c, d, lid, shade] of cuboidFaces) {
    const points = [corners[a], corners[b], corners[c], corners[d]];
    if (!frontFacing(points)) continue;
    const depth = points.reduce((sum, p) => sum + p.depth, 0) / 4;
    worldItems.push({ depth, points, color: paper, opacity, ribbons, lid, shade });

function placeControl(button, points, clickable) {

  const buttonWidth = Math.max(...xs) - left;
  const buttonHeight = Math.max(...ys) - top;
  button.style.transform = 'translate3d(' + left.toFixed(1) + 'px,' + top.toFixed(1) + 'px,0)';
  button.style.width = buttonWidth.toFixed(1) + 'px';

function addFrames(t, forming) {

function strip(points, along, color) {
  const [a, b, c, d] = points;
  const interpolate = (p, q, t) => ({ x: mix(p.x, q.x, t), y: mix(p.y, q.y, t) });
  const ribbon = along ? [interpolate(a, d, .42), interpolate(b, c, .42), interpolate(b, c, .58), interpolate(a, d, .58)] :
    [interpolate(a, b, .42), interpolate(a, b, .58), interpolate(d, c, .58), interpolate(d, c, .42)];
  polygon(ribbon);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawFrameArt(item) {
  const [a, b, c, d] = item.points;
  ctx.save();
  polygon(item.points);
  ctx.fillStyle = '#fff1e3';
  ctx.fill();
  ctx.strokeStyle = '#78533f';
  ctx.lineWidth = .8;
  ctx.stroke();
  ctx.clip();
  const sx = (b.x - a.x + c.x - d.x) / 2;
  const sy = (b.y - a.y + c.y - d.y) / 2;
  const tx = (d.x - a.x + c.x - b.x) / 2;
  const ty = (d.y - a.y + c.y - b.y) / 2;
  ctx.transform(sx, sy, tx, ty, (a.x + b.x + c.x + d.x - 2 * sx - 2 * tx) / 4, (a.y + b.y + c.y + d.y - 2 * sy - 2 * ty) / 4);
  const image = frameArt.get(item.artwork);
  if (image?.naturalWidth && image.classList.contains('gift-artwork')) {
    ctx.fillStyle = '#272739';
    ctx.fillRect(0, 0, 1, 1);
    const ratio = image.naturalHeight / image.naturalWidth;
    ctx.drawImage(image, 0, (1 - ratio) / 2, 1, ratio);
  } else if (image?.naturalWidth) {
    const edge = Math.min(image.naturalWidth, image.naturalHeight);
    ctx.drawImage(image, (image.naturalWidth - edge) / 2, (image.naturalHeight - edge) / 2, edge, edge, -.03, -.03, 1.06, 1.06);
  } else if (image instanceof HTMLCanvasElement) {
    ctx.drawImage(image, 0, 0, 1, 1);
  }
  ctx.restore();
}

function drawWorld() {
  worldItems.sort((a, b) => a.depth - b.depth);
  ctx.lineCap = 'round';
  for (const item of worldItems) {
    ctx.globalAlpha = item.opacity;
    if (item.segment) {
      const [a, b] = item.segment;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = '#ffe4a1';
      ctx.lineWidth = Math.max(.67, worldScale * .012);
      ctx.stroke();
    } else if (item.point) {
      const { x, y } = item.point;
      const size = item.size;
      if (item.bloom) {
        const sprite = item.color === '#ffb4c5' || item.color === '#ff9cba' ? roseHalo :
          item.color === '#c1f5ff' || item.color === '#f5fcff' ? iceHalo :
          item.color === '#fff6dd' ? whiteHalo : warmHalo;
        const radius = size * (size > 7 ? 5.2 : 4.2);
        ctx.globalAlpha = item.opacity * .78;
        ctx.drawImage(sprite, x - radius, y - radius, 2 * radius, 2 * radius);
        ctx.globalAlpha = item.opacity;
      }
      ctx.fillStyle = item.color;
      if (item.shape === 'star' || item.shape === 'diamond') {
        starPath(x, y, size * 1.44, 4, item.shape === 'star' ? .22 : .015);
        ctx.fill();
      } else if (size > 2) {
        ctx.beginPath();
        ctx.arc(x, y, size * .62, 0, tau);
        ctx.fill();
      } else {
        ctx.fillRect(x - size / 2, y - size / 2, size, size);
      }
    } else if (item.artwork) {
      drawFrameArt(item);
    } else {
      polygon(item.points);
      ctx.fillStyle = item.color;
      ctx.fill();
      if (item.ribbons) {
        strip(item.points, false, item.lid ? '#ffeec7' : '#e8c782');
        if (item.lid) strip(item.points, true, '#fff2d1');
      }
      if (item.shade) {
        polygon(item.points);
        ctx.fillStyle = 'rgba(13,16,42,' + item.shade + ')';
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  worldItems.length = 0;
}

function drawScene(t, dt) {

}

function render(now) {
  frame = 0;
  const targetStep = mobile ? 1000 / 30 : 1000 / 60;
  const step = lastFrame ? now - lastFrame : targetStep;
  if (step < targetStep - 2) {
    invalidateScene();
    return;
  }
  if (lastFrame) elapsed += Math.min(step, 100);
  const start = performance.now();
  drawScene(elapsed / 1000, Math.min(step, 100) / 1000);
  lastFrame = now;
  averageCost = mix(averageCost, performance.now() - start, .12);
  averageStep = mix(averageStep || step, step, .12);
  samples++;
  if (samples % 12 === 0 && (averageCost > targetStep * .53 || averageStep > targetStep * 1.38)) {
    particleBudget = Math.max(600, particleBudget - 250);
  } else if (samples % 48 === 0 && averageCost < targetStep * .32 && averageStep < targetStep * 1.19) {
    const ceiling = mobile ? 2400 : maxParticles;
    particleBudget = Math.min(ceiling, particleBudget + 150);

  invalidateScene();
}

function invalidateScene() {

function updateVisibility() {

function classifyGesture(result, aspect = 1) {
  const gesture = result.gestures[0]?.[0];
  const hand = result.worldLandmarks?.[0] || result.landmarks[0];
  if (!hand) return null;
  if (gesture?.categoryName === 'Closed_Fist' && gesture.score >= .61) return 'tree';
  const worldCoordinates = Boolean(result.worldLandmarks?.[0]);
  const distance = (a, b) => Math.hypot(
    (hand[a].x - hand[b].x) * (worldCoordinates ? 1 : aspect),
    hand[a].y - hand[b].y,
    worldCoordinates ? hand[a].z - hand[b].z : 0,
  );
  const palm = Math.max(distance(0, 9), distance(5, 17));
  const pinch = palm > 0 && distance(4, 8) / palm < .29;
  if (pinch) return 'photo';
  if (gesture?.categoryName === 'Open_Palm' && gesture.score >= .55) return 'scatter';
  return null;
}

    for (const card of cards) card.classList.toggle('active', card.dataset.gesture === action);
  }

  function stop(message = '开启摄像头后，将一只手放在画面内。') {
    generation++;
    cancelAnimationFrame(frame);
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    preview.srcObject = null;
    box.hidden = true;
    busy = false;
    button.removeAttribute('aria-busy');
    label.textContent = '开启摄像头';
    candidate = lastGesture = null;
    streak = 0;
    lastFrame = -Infinity;
    lastVideoTime = -1;
    detectionInterval = 75;
    publish(message);
  }

  function detect(now) {
    if (!stream) return;
    frame = requestAnimationFrame(detect);
    if (now - lastFrame < detectionInterval || preview.readyState < 2 || preview.currentTime === lastVideoTime) return;
    lastFrame = now;
    lastVideoTime = preview.currentTime;
    try {
      const started = performance.now();
      const result = recognizer.recognizeForVideo(preview, now);
      onPosition?.(result.landmarks[0]?.[9]?.x ?? null);
      const cost = performance.now() - started;
      detectionInterval = detectionInterval * .85 + Math.max(75, Math.min(240, cost * 3)) * .15;
      const action = classifyGesture(result, preview.videoWidth / preview.videoHeight);
      if (action !== candidate) {
        candidate = action;
        streak = 1;
        return;
      }
      streak++;
      if (streak < 3 || lastGesture === action) return;
      lastGesture = action;
      if (action) {
        publish(labels[action], action);
        onGesture(action);
      } else {
        publish('等待手势 · 握拳、摊手或捏指');
      }
    } catch {
      stop('手势识别已停止，请重新开启摄像头。');
    }
  }

  button.addEventListener('click', async () => {
    if (stream || busy) {
      stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      publish('请通过 HTTPS 或 localhost 打开网页以启用摄像头。');
      return;
    }
    const attempt = ++generation;
    busy = true;
    button.setAttribute('aria-busy', 'true');
    label.textContent = '取消启动';
    publish('等待摄像头权限…');
    try {
      const acquired = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      });
      if (generation !== attempt) {
        acquired.getTracks().forEach(track => track.stop());
        return;
      }
      stream = acquired;
      preview.srcObject = stream;
      stream.getVideoTracks()[0]?.addEventListener('ended', () => {
        if (generation === attempt) stop('摄像头已断开。');
      });
      box.hidden = false;
      publish('正在加载手势模型…');
      await preview.play();
      if (!recognizer) {
        const { FilesetResolver, GestureRecognizer } = await import(modelBase + '/vision_bundle.mjs');
        const vision = await FilesetResolver.forVisionTasks(modelBase + '/wasm');
        const loaded = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
          runningMode: 'VIDEO', numHands: 1,
        });
        if (generation !== attempt) {
          loaded.close();
          return;
        }
        recognizer = loaded;
      }
      if (generation !== attempt) return;
      busy = false;
      button.removeAttribute('aria-busy');
      label.textContent = '关闭摄像头';
      publish('等待手势 · 握拳、摊手或捏指');
      frame = requestAnimationFrame(detect);
    } catch (error) {
      if (generation !== attempt) return;
      const reason = {
        NotAllowedError: '摄像头权限未开启，仍可使用树下按钮。',
        NotFoundError: '未找到摄像头，仍可使用树下按钮。',
        NotReadableError: '摄像头暂不可用，请检查是否被其他应用占用。',
      };
      stop(reason[error.name] || '摄像头或手势模型加载失败，请检查网络后重试。');
    }
  });
  window.addEventListener('pagehide', () => stop());
}

const builtinSongs = {

function setupMusic(onEnergy) {
  const button = document.querySelector('#play');
  const fileInput = document.querySelector('#music-file');
  const track = document.querySelector('#track');
  const customOption = track.querySelector('option[value=custom]');
  const state = document.querySelector('#track-state');
  const audio = new Audio();
  audio.loop = true;
  audio.preload = 'none';
  audio.crossOrigin = 'anonymous';
  let context, analyser, spectrum, sourceUrl, objectUrl, frame, energy = 0;
  let trackVersion = 0;
  let customFile;

  function setSource() {
    audio.pause();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = null;
    sourceUrl = null;
    if (track.value === 'custom') {
      if (customFile) sourceUrl = objectUrl = URL.createObjectURL(customFile);
    } else if (builtinSongs[track.value]) {
      const base = location.protocol === 'file:' ? 'https://cloud789922.github.io/1/' : location.href;
      sourceUrl = new URL(builtinSongs[track.value], base).href;
    }
    if (sourceUrl) audio.src = sourceUrl;
    else {
      audio.removeAttribute('src');
      audio.load();
    }
    trackVersion++;
  }

  function sample() {
    if (audio.paused) return;
    analyser.getByteFrequencyData(spectrum);
    let level = 0;
    for (let i = 2; i < 29; i++) {
      level += spectrum[i] * (i < 8 ? 1.35 : 1);
    }
    const peak = Math.min(1, level / (255 * 16));
    energy += (peak - energy) * (peak > energy ? .41 : .16);
    onEnergy(energy);
    frame = requestAnimationFrame(sample);
  }

  async function play() {
    if (!sourceUrl) setSource();
    if (!sourceUrl) return;
    const version = trackVersion;
    try {
      if (!context) {
        context = new AudioContext();
        analyser = context.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = .48;
        spectrum = new Uint8Array(analyser.frequencyBinCount);
        const source = context.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(context.destination);
      }
      await Promise.all([context.resume(), audio.play()]);
    } catch (error) {
      if (version !== trackVersion || error.name === 'AbortError') return;
      audio.pause();
      state.textContent = '无法播放，请选择其他音频或重试。';
    }
  }

  button.addEventListener('click', () => {
    if (audio.paused) void play();
    else audio.pause();
  });
  audio.addEventListener('playing', () => {
    button.textContent = 'Ⅱ';
    button.setAttribute('aria-label', '暂停音乐');
    state.textContent = '正在播放 · 粒子随音乐律动';
    cancelAnimationFrame(frame);
    sample();
  });
  audio.addEventListener('pause', () => {
    if (!audio.paused) return;
    button.textContent = '▶';
    button.setAttribute('aria-label', '播放音乐');
    state.textContent = '已暂停';
    cancelAnimationFrame(frame);
    energy = 0;
    onEnergy(0);
  });
  audio.addEventListener('error', () => {
    if (!sourceUrl) return;
    state.textContent = '无法读取这段音频，请重新选择。';
  });
  track.addEventListener('change', () => {
    const resume = !audio.paused;
    setSource();
    state.textContent = track.value === 'custom' ? '本地音乐 · 点击播放' : '内置音乐 · 点击播放';
    if (resume) void play();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    customFile = file;
    customOption.hidden = false;
    customOption.textContent = file.name;
    track.value = 'custom';
    setSource();
    void play();
  });
}

let shared = {};
try { shared = JSON.parse(starter?.textContent || '{}') || {}; } catch {}
const personalSuffix = shared.id ? '-' + shared.id : '';
const settingsKey = 'winter-lights-settings' + personalSuffix;
const defaultGreeting = '愿这个冬夜，有星光也有温暖。';
const giftThemes = {
  style: [['💄','口红'],['👜','小挎包'],['👠','高跟鞋'],['🧴','香水'],['📿','项链'],['💝','护肤礼盒'],['💐','花束'],['🍷','红酒'],['🧸','抱抱熊'],['🧣','冬日围巾']],
  game: [['🎮','游戏手柄'],['🎧','耳机'],['⌨️','键盘'],['📷','相机'],['🛹','滑板'],['⚽','足球'],['👟','运动鞋'],['🧩','拼图']],
  family: [['🍼','奶瓶'],['🪇','摇铃'],['🐤','小黄鸭'],['🚂','玩具火车'],['🧸','玩偶'],['📚','故事书'],['🧤','暖手套'],['🎈','气球']],
};
const photos = [];
let currentPhoto = -1;
let settings = { ...shared.settings };
try {
  settings = { ...settings, ...JSON.parse(localStorage.getItem(settingsKey) || '{}') };
} catch {}

for (const [id, key] of Object.entries({
  palette: 'palette', shape: 'shape', gift: 'gift', density: 'density', 'custom-color': 'color', 'setting-scene': 'scenery',
})) {
  const input = document.getElementById(id);
  if (settings[key] != null && (input.tagName !== 'SELECT' || [...input.options].some(option => option.value === settings[key]))) {
    input.value = settings[key];
  }
  const apply = () => {
    effects[key] = key === 'density' ? Number(input.value) : input.value;
    $('#density-value').textContent = effects.density;
    $('#color-field').hidden = effects.palette !== 'custom';
    if (key === 'gift') syncGiftControl();
    invalidateScene();
  };
  apply();
  input.addEventListener('input', () => {
    apply();
    settings[key] = effects[key];
    saveSettings();
  });
}

function saveSettings() {
  try { localStorage.setItem(settingsKey, JSON.stringify(settings)); } catch {}
}

function renderGreeting() {
  const recipient = $('#recipient').value.trim();
  const sender = $('#sender').value.trim();
  const message = $('#dedication').value.trim();
  $('#hero-recipient').hidden = !recipient;
  $('#hero-recipient').textContent = '送给 ' + recipient;
  $('#hero-sender').hidden = !sender;
  $('#hero-sender').textContent = '来自 ' + sender;
  $('#hero-message').textContent = message || defaultGreeting;
}
for (const id of ['recipient', 'sender', 'dedication']) {
  const input = document.getElementById(id);
  input.value = settings[id] || '';
  input.addEventListener('input', () => {
    settings[id] = input.value;
    renderGreeting();
    saveSettings();
  });
}
renderGreeting();

function updateCountdown() {
  const now = new Date();
  const year = now.getFullYear();
  const christmas = new Date(year, 11, 25);
  if (now.getMonth() === 11 && now.getDate() === 25) {
    $('#christmas-countdown').textContent = '今天是圣诞节';
    return;
  }
  if (now > christmas) christmas.setFullYear(year + 1);
  const minutes = Math.floor((christmas - now) / 60000);
  $('#christmas-countdown').textContent = '距圣诞还有 ' + Math.floor(minutes / 1440) +
    ' 天 ' + Math.floor(minutes / 60) % 24 + ' 小时 ' + minutes % 60 + ' 分';
}
updateCountdown();
setInterval(updateCountdown, 30000);

const themeSelect = $('#gift-theme');
themeSelect.value = Object.hasOwn(giftThemes, settings.giftTheme) ? settings.giftTheme : 'style';
function selectedGifts() {
  const theme = themeSelect.value;
  const hiddenGifts = settings.hiddenGifts?.[theme] || [];
  return giftThemes[theme].filter(([, name]) => !hiddenGifts.includes(name));
}

function createGiftArtwork(name, icon) {
  const source = giftArt[name];
  const artwork = document.createElement(source ? 'img' : 'span');
  artwork.setAttribute('aria-hidden', 'true');
  if (source) {
    artwork.className = 'gift-artwork';
    artwork.alt = '';
    artwork.src = source;
  } else {
    artwork.textContent = icon;
  }
  return artwork;
}

function renderGiftLibrary() {
  const theme = themeSelect.value;
  const active = new Set(selectedGifts().map(([, name]) => name));
  $('#gift-library').replaceChildren(...giftThemes[theme].map(([icon, name]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('aria-pressed', String(active.has(name)));
    button.append(createGiftArtwork(name, icon), document.createTextNode(name));
    button.onclick = () => {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      const hidden = giftThemes[theme].map(([, label]) => label).filter(label => !active.has(label));
      settings.hiddenGifts = { ...settings.hiddenGifts, [theme]: hidden };
      button.setAttribute('aria-pressed', String(active.has(name)));
      saveSettings();
      renderMemoryCards();
    };
    return button;
  }));
}
themeSelect.addEventListener('change', () => {
  settings.giftTheme = themeSelect.value;
  saveSettings();
  renderGiftLibrary();
  renderMemoryCards();
});

function renderMemoryCards() {
  const cards = photos.slice(0, 12).map(photo => ({ photo, name: photo.name }));
  const gifts = selectedGifts();
  for (const [icon, name] of gifts.slice(0, 12 - cards.length)) cards.push({ icon, name });
  const children = cards.map((entry) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'memory-token';
    button.setAttribute('aria-label', '查看礼物：' + entry.name);
    if (entry.photo) {
      const image = document.createElement('img');
      image.src = entry.photo.url;
      image.alt = '';
      button.append(image);
    } else {
      button.append(createGiftArtwork(entry.name, entry.icon));
    }
    button.onclick = () => showMemoryEntry(entry, button.getBoundingClientRect());
    return button;
  });
  $('#floating-memories').replaceChildren(...children);
  setMemoryNodes(children);
}

function setScene(action) {
  effects.scattered = action === 'scatter';
  stage.dataset.orbit = String(effects.scattered);
  $('#orbit-hint').hidden = !effects.scattered;
  syncGiftControl();
  for (const button of document.querySelectorAll('[aria-pressed][data-action]')) {
    button.setAttribute('aria-pressed', String(button.dataset.action === action));
  }
  invalidateScene();
}

const database = new Promise((resolve, reject) => {
  try {
    const request = indexedDB.open('winter-lights-album' + personalSuffix, 1);
    request.onupgradeneeded = () => request.result.createObjectStore('photos', { keyPath: 'id' });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('照片数据库正在使用'));
  } catch (error) { reject(error); }
});
async function transaction(mode, work) {
  const db = await database;
  return new Promise((resolve, reject) => {
    const operation = db.transaction('photos', mode);
    const result = work(operation.objectStore('photos'));
    operation.oncomplete = () => resolve(result?.result);
    operation.onabort = () => reject(operation.error || new Error('相册操作已中止'));
  });
}
function hydrate(record) {
  return { ...record, url: URL.createObjectURL(record.blob) };
}
function renderPhotos() {
  renderMemoryCards();
  $('#photo-count').textContent = photos.length + ' 张';
  $('#thumbs').replaceChildren(...photos.map((photo, index) => {
    const tile = document.createElement('div');
    tile.className = 'thumb';
    const button = document.createElement('button');
    button.setAttribute('aria-label', '查看 ' + photo.name);
    button.onclick = () => {
      studio.close();
      showMemoryEntry({ photo, name: photo.name });
    };
    const image = document.createElement('img');
    image.src = photo.url;
    image.alt = '';
    button.append(image);
    const remove = document.createElement('button');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.setAttribute('aria-label', '删除 ' + photo.name);
    remove.onclick = async () => {
      remove.disabled = true;
      try {
        if (photo.cached) await transaction('readwrite', store => store.delete(photo.id));
        const index = photos.indexOf(photo);
        if (index !== -1) photos.splice(index, 1);
        URL.revokeObjectURL(photo.url);
        renderPhotos();
        $('#photo-status').textContent = '已移除照片。';
      } catch {
        remove.disabled = false;
        $('#photo-status').textContent = '无法删除照片，请重试。';
      }
    };
    tile.append(button, remove);
    return tile;
  }));
}
async function restorePhotos() {
  for (const source of Array.isArray(shared.photos) ? shared.photos : []) {
    try {
      const [metadata, data] = source.data.split(',');
      if (!metadata.startsWith('data:image/') || !metadata.endsWith(';base64')) continue;
      const bytes = Uint8Array.from(atob(data), char => char.charCodeAt(0));
      photos.push(hydrate({ name: source.name, blob: new Blob([bytes], { type: metadata.slice(5, -7) }), cached: false }));
    } catch {}
  }
  let records;
  try {
    records = await transaction('readonly', store => store.getAll());
  } catch {
    $('#photo-status').textContent = '浏览器存储不可用，照片仅在本次打开时显示。';
    return;
  }
  records.sort((a, b) => a.added - b.added);
  photos.push(...records.map(record => hydrate({ ...record, cached: true })));
}
const photosReady = restorePhotos().then(() => {
  renderPhotos();
});
renderGiftLibrary();
renderMemoryCards();
$('#photo-file').addEventListener('change', async event => {
  const input = event.target;
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  input.disabled = true;
  await photosReady;
  let added = 0;
  let temporary = 0;
  for (const [index, file] of files.entries()) {
    try {
      const bitmap = await createImageBitmap(file);
      bitmap.close();
    } catch { continue; }
    const record = { id: crypto.randomUUID(), name: file.name, blob: file, added: Date.now() + index };
    let cached = true;
    try {
      await transaction('readwrite', store => store.add(record));
    } catch {
      cached = false;
      temporary++;
    }
    photos.push(hydrate({ ...record, cached }));
    added++;
  }
  renderPhotos();
  const messages = [];
  if (added - temporary) messages.push('已缓存 ' + (added - temporary) + ' 张照片');
  if (temporary) messages.push(temporary + ' 张仅在本次显示');
  if (files.length > added) messages.push(files.length - added + ' 张图片无法读取');
  $('#photo-status').textContent = messages.join('，') + '。';
  input.disabled = false;
});

const dialog = $('#album');
const photoCard = dialog.querySelector('.photo-card');
const largePhoto = $('#large-photo');
const largeGift = $('#large-gift');
const largeGiftArt = largeGift.querySelector('.gift-preview');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let albumRequest = 0;
let pictureReveal;
let openGift, previousGift;
let nextGiftIndex = 0;

function setPicture(entry) {
  $('#album-empty').hidden = Boolean(entry);
  largePhoto.hidden = !entry?.photo;
  largeGift.hidden = !entry || Boolean(entry.photo);
  if (entry?.photo) {
    largePhoto.src = entry.photo.url;
    largePhoto.alt = entry.name;
    return largePhoto;
  } else if (entry) {
    const artwork = createGiftArtwork(entry.name, entry.icon);
    largeGiftArt.replaceChildren(artwork);
    largeGift.querySelector('strong').textContent = entry.name;
    if (artwork instanceof HTMLImageElement) return artwork;
  }
}

function nextMemory(index) {
  if (photos.length) {
    currentPhoto = ((index % photos.length) + photos.length) % photos.length;
    const photo = photos[currentPhoto];
    return { photo, name: photo.name };
  }
  const gifts = selectedGifts();
  if (gifts.length) {
    const [icon, name] = gifts[nextGiftIndex++ % gifts.length];
    return { icon, name };
  }
  return null;
}

function showMemoryEntry(entry, origin, box) {
  if (dialog.open) return;
  const request = ++albumRequest;
  pictureReveal?.cancel();
  openGift?.classList.remove('is-open');
  openGift = box;
  if (box) {
    previousGift = box;
    box.classList.add('is-open');
  }
  const image = setPicture(entry);
  const motion = !motionPreference.matches && photoCard.animate;
  dialog.classList.toggle('gift-opening', Boolean(box && motion));
  dialog.classList.remove('picture-loading');
  dialog.showModal();
  photoCard.focus({ preventScroll: true });
  if (!motion) return;
  if (image && !image.complete && image.decode) {
    dialog.classList.add('picture-loading');
    const reveal = () => {
      if (request !== albumRequest || !dialog.open) return;
      dialog.classList.remove('picture-loading');
      animatePicture(origin, Boolean(box));
    };
    void image.decode().then(reveal, reveal);
  } else {
    animatePicture(origin, Boolean(box));
  }
}

function chooseGift(requestedGift) {
  if (effects.scattered) return;
  const candidates = (requestedGift ? [requestedGift] : stageGifts)
    .map(button => ({ button, bounds: button.getBoundingClientRect() }))
    .filter(({ bounds }) => bounds.width && bounds.top + bounds.height * .36 > 0 &&
      bounds.top + bounds.height * .36 < innerHeight);
  const fresh = candidates.filter(({ button }) => button !== previousGift);
  const available = fresh.length ? fresh : candidates;
  return available[Math.floor(Math.random() * available.length)];
}

function animatePicture(origin, fromBox) {
  const keys = [];
  if (origin) {
    const revealed = photoCard.getBoundingClientRect();
    const x = origin.left + origin.width / 2 - revealed.left - revealed.width / 2;
    const y = origin.top + origin.height * (fromBox ? .29 : .5) - revealed.top - revealed.height / 2;
    const scale = Math.min(origin.width / revealed.width, origin.height / revealed.height);
    keys.push({ transform: `translate(${x}px,${y}px) rotate(-7deg) scale(${scale})`, opacity: fromBox ? 0 : .8 });
    if (fromBox) {
      keys.push({ transform: `translate(${x}px,${y - 24}px) rotate(-5deg) scale(${Math.min(.35, scale * 1.75)})`, opacity: 1, offset: .28 });
    }
  } else {
    keys.push({ transform: 'perspective(880px) rotateY(16deg) scale(.94)', opacity: .42 });
  }
  keys.push({ transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 });
  pictureReveal = photoCard.animate(keys, {
    duration: fromBox ? 620 : origin ? 440 : 270,
    easing: 'cubic-bezier(.2,.72,.26,1)',
  });
}

function showNextPhoto(requestedGift) {
  if (dialog.open) return;
  const request = ++albumRequest;
  void photosReady.then(() => {
    if (request !== albumRequest || dialog.open) return;
    const chosen = chooseGift(requestedGift);
    showMemoryEntry(nextMemory(currentPhoto + 1), chosen?.bounds, chosen?.button);
  });
}

for (const gift of stageGifts) gift.onclick = () => showNextPhoto(gift);
$('#album-add').onclick = () => {
  dialog.close();
  studio.showModal();
  $('#photo-panel').scrollIntoView({ block: 'nearest' });
  $('#photo-file').focus({ preventScroll: true });
};
dialog.addEventListener('close', () => {
  if (dialog.open) return;
  pictureReveal?.cancel();
  pictureReveal = null;
  openGift?.classList.remove('is-open');
  openGift = null;
  dialog.classList.remove('gift-opening', 'picture-loading');
});
dialog.addEventListener('click', event => {
  if (event.target === dialog || event.target === photoCard) dialog.close();
});

function act(action, gesture = false) {
  if (action === 'photo') {
    if (effects.scattered && !dialog.open) openNearestMemory();
    else showNextPhoto();
  }
  else {
    albumRequest++;
    if (gesture && dialog.open) dialog.close();
    setScene(action);
  }
}
for (const button of document.querySelectorAll('[data-action]')) {
  button.addEventListener('click', () => act(button.dataset.action));
}

function openNearestMemory() {
  const targetX = innerWidth * .50;
  const targetY = innerHeight * .53;
  const cards = [...$('#floating-memories').children];
  let closest, distance = Infinity;
  for (const card of cards) {
    if (card.hidden) continue;
    const box = card.getBoundingClientRect();
    const offset = Math.hypot(box.left + box.width / 2 - targetX, box.top + box.height / 2 - targetY);
    if (offset < distance) {
      closest = card;
      distance = offset;
    }
  }
  if (closest) closest.click();
  else showNextPhoto();
}

const roomCanvas = $('#scene');
let drag;
roomCanvas.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  drag = { id: event.pointerId, x: event.clientX };
  roomCanvas.setPointerCapture(event.pointerId);
});
roomCanvas.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  effects.orbit += (event.clientX - drag.x) * .006;
  drag.x = event.clientX;
  invalidateScene();
});
roomCanvas.addEventListener('lostpointercapture', () => { drag = null; });

let handX = null;
setupCamera(action => {
  if (!studio.open) act(action, true);
}, position => {
  if (effects.scattered && !studio.open && !dialog.open && position !== null && handX !== null) {
    const movement = position - handX;
    if (Math.abs(movement) > .005) effects.orbit -= movement * 5.2;
  }
  handX = position;
});
const cameraStatus = $('#camera-status');
const cameraFeedback = $('#camera-feedback');
new MutationObserver(() => {
  cameraFeedback.textContent = cameraStatus.textContent;
  cameraFeedback.hidden = false;
}).observe(cameraStatus, { childList: true, characterData: true, subtree: true });

$('#open-studio').onclick = () => studio.showModal();
$('#open-music').onclick = () => {
  studio.showModal();
  $('#music-panel').scrollIntoView({ block: 'nearest' });
  $('#music-panel').focus({ preventScroll: true });
};
$('#close-studio').onclick = () => studio.close();
const fullscreenButton = $('#fullscreen');
if (document.fullscreenEnabled && stage.requestFullscreen) {
  fullscreenButton.hidden = false;
  fullscreenButton.onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {}
  };
  document.addEventListener('fullscreenchange', () => {
    fullscreenButton.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });
}
studio.addEventListener('click', event => {
  const bounds = studio.getBoundingClientRect();
  if (event.target === studio && (event.clientX < bounds.left || event.clientX > bounds.right)) studio.close();
});

const trackSelect = $('#track');
if ([...trackSelect.options].some(option => option.value === settings.track && !option.hidden)) trackSelect.value = settings.track;
trackSelect.addEventListener('change', () => {
  if (trackSelect.value !== 'custom') {
    settings.track = trackSelect.value;
    saveSettings();
  }
});
setupMusic(energy => { effects.energy = energy; });

function readPhotoData(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function exportWish() {
  const snapshot = documentShell.cloneNode(true);
  snapshot.querySelector('#stage-gifts').replaceChildren();
  snapshot.querySelector('#wish-data')?.remove();
  const moduleScript = snapshot.querySelector('head script[type=module]');
  if (moduleScript.hasAttribute('src')) {
    const files = ['scene.js', 'camera.js', 'music.js', 'gift-art.js', 'app.js', 'style.css'];
    const loaded = await Promise.all(files.map(async name => {
      const response = await fetch('./' + name);
      if (!response.ok) throw new Error('Could not load ' + name);
      return response.text();
    }));
    const css = document.createElement('style');
    css.textContent = loaded.pop();
    snapshot.querySelector('head link[rel=stylesheet]').replaceWith(css);
    moduleScript.removeAttribute('src');
    moduleScript.textContent = loaded.map(source => source
      .replace(/^import .*;\r?\n/gm, '')
      .replace(/^export (?=const |function )/gm, '')).join('\n');
  }
  const data = document.createElement('script');
  data.id = 'wish-data';
  data.type = 'application/json';
  const packaged = await Promise.all(photos.map(async photo => ({ name: photo.name, data: await readPhotoData(photo.blob) })));
  data.textContent = JSON.stringify({ id: crypto.randomUUID(), settings, photos: packaged }).replace(/</g, '\\u003c');
  moduleScript.before(data);
  const file = new Blob(['<!doctype html>\n' + snapshot.outerHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(file);
  const download = document.createElement('a');
  download.href = url;
  download.download = '我的冬夜星树.html';
  download.click();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

const shareButton = $('#download-wish');
shareButton.onclick = async () => {
  shareButton.disabled = true;
  $('#share-status').textContent = '正在准备网页文件…';
  try {
    await photosReady;
    await exportWish();
    $('#share-status').textContent = '专属网页已生成。';
  } catch {
    $('#share-status').textContent = '生成失败，请重新尝试。';
  } finally {
    shareButton.disabled = false;
  }
};

</script>

        <p id="hero-recipient" hidden></p>
        <p id="hero-message">愿这个冬夜，有星光也有温暖。</p>
        <p id="hero-sender" hidden></p>
      </div>
      <p class="countdown" id="christmas-countdown"></p>
    </header>
    <div class="stage-scene"><label for="setting-scene">冬夜场景</label><select id="setting-scene">
      <option value="forest">月夜雪林</option><option value="cabin">壁炉小屋</option><option value="aurora">极光山谷</option><option value="dawn">晨曦雪原</option>
    </select><button id="fullscreen" type="button" hidden>全屏</button></div>

    <div class="stage-actions" role="group" aria-label="手动控制圣诞树">
      <button data-action="tree" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m12 3 5 7h-2l4 6H5l4-6H7l5-7zm0 13v5"/></svg>汇聚</button>
      <button data-action="scatter" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 2v7m0 6v7M2 12h7m6 0h7M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/></svg>散开</button>
      <button data-action="photo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 2-2 7 6"/><circle cx="16" cy="9" r="1"/></svg>照片</button>
          <button id="camera" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></svg><span>手势</span></button>
      <button id="open-music" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M9 17V6l10-2v11M9 17c0 2-5 3-5 1s5-3 5-1zm10-2c0 2-5 3-5 1s5-3 5-1z"/></svg>音乐</button>
      <button id="open-studio" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg>装扮</button>
    </div>
    <div id="camera-feedback" class="camera-feedback" aria-live="polite" hidden></div>
  </section>
</main>
<dialog id="studio" class="studio" aria-labelledby="studio-title">
  <header class="studio-header"><div><small>冬夜星树</small><h2 id="studio-title">装扮与祝福</h2></div><button id="close-studio" type="button" aria-label="关闭装扮">×</button></header>
  <div class="sidebar">
    <section class="panel">
      <h2>写好你的祝福</h2>
      <div class="personal-fields">
        <label>送给<input id="recipient" maxlength="28" placeholder="收礼人的名字"></label>
        <label>来自<input id="sender" maxlength="28" placeholder="你的名字"></label>
        <label>祝福<textarea id="dedication" maxlength="160" rows="3" placeholder="写几句想说的话"></textarea></label>
      </div>
    </section>
    <section class="panel">
      <h2>礼物清单</h2>
      <label class="field" for="gift-theme">礼物主题<select id="gift-theme"><option value="style">时尚心愿</option><option value="game">玩家心愿</option><option value="family">童年心愿</option></select></label>
      <div id="gift-library" class="gift-library" role="group" aria-label="选入礼物星河的礼物"></div>
    </section>
    <section class="panel gestures">
      <h2><span class="section-icon" aria-hidden="true">◎</span>手势控制</h2>
      <div class="gesture-grid">
        <div data-gesture="tree"><svg viewBox="0 0 32 32"><path d="M8 17v-4a2 2 0 0 1 4 0v-2a2 2 0 0 1 4 0v-1a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v7c0 4-3 8-8 8-4 0-7-3-8-7l-2-5a2 2 0 0 1 3-2l4 4h5m-6-4v2m4-3v3m4-3v3"/></svg><b>握拳</b><small>汇聚成树</small></div>
        <div data-gesture="scatter"><svg viewBox="0 0 32 32"><path d="M9 17V9a1.7 1.7 0 0 1 3.4 0v6-9a1.7 1.7 0 0 1 3.4 0v9-10a1.7 1.7 0 0 1 3.4 0v10-7a1.7 1.7 0 0 1 3.4 0v10l2-2a2 2 0 0 1 3 2l-3 6a8.5 8.5 0 0 1-15 .4L5 18a2 2 0 0 1 3-2l1 1z"/></svg><b>摊手</b><small>粒子散开</small></div>
        <div data-gesture="photo"><svg viewBox="0 0 32 32"><path d="M10 17c-2-1-3-4-1-7 2-3 6-4 9-3l4 2a2 2 0 0 1-2 3l-4-1a4 4 0 0 0-3 2c-1 2 0 4 3 4h2l3-3a2 2 0 0 1 3 2l-2 3 4-2a2 2 0 0 1 2 3l-5 4c-2 2-4 3-8 3-5 0-8-3-10-7a2 2 0 0 1 3-2l3 2h4"/><path d="M6 8 4 6m1 6H2"/></svg><b>捏指</b><small>查看礼物</small></div>
      </div>
      <p class="hint" id="camera-status" aria-live="polite">开启摄像头后，将一只手放在画面内。</p>
    </section>
    <section class="panel settings">
      <h2><span class="section-icon" aria-hidden="true">✧</span>装点星树</h2>
      <div class="field"><label for="palette">粒子配色</label><select id="palette"><option value="pine">松绿暖金</option><option value="frost">冰蓝银白</option><option value="rose">蔷薇粉金</option><option value="custom">自选颜色</option></select></div>
      <div class="field" id="color-field" hidden><label for="custom-color">粒子颜色</label><input type="color" id="custom-color" value="#8fe8af"></div>
      <div class="field"><label for="shape">粒子形状</label><select id="shape"><option value="glow">光点</option><option value="star">星芒</option><option value="diamond">菱形</option></select></div>
      <div class="field"><label for="gift">礼盒样式</label><select id="gift"><option value="classic">绯红金缎</option><option value="ice">冰蓝银缎</option><option value="pink">莓粉丝带</option><option value="none">隐藏礼盒</option></select></div>
      <div class="field range"><label for="density">粒子密度</label><input id="density" type="range" min="600" max="4300" step="100" value="3000"><output id="density-value" for="density">3000</output></div>
    </section>
    <section class="panel music" id="music-panel" tabindex="-1">
      <h2><span class="section-icon" aria-hidden="true">♫</span>音乐律动</h2>
      <div class="player"><button class="play" id="play" type="button" aria-label="播放音乐">▶</button><div><select id="track" aria-label="选择音乐"><option value="ambient">氛围版</option><option value="lawrence">劳伦斯</option><option value="one">1号</option><option value="two">2号</option><option value="custom" hidden>本地音乐</option></select><small id="track-state">点击播放音乐</small></div><label class="upload" for="music-file">本地音乐<input id="music-file" type="file" accept="audio/*"></label></div>
    </section>
    <section class="panel photos" id="photo-panel">
      <h2><span class="section-icon" aria-hidden="true">▧</span>圣诞相册 <span class="photo-count" id="photo-count">0 张</span></h2>
      <div class="thumbs" id="thumbs"></div>
      <label class="upload add" for="photo-file">＋ 添加照片<input id="photo-file" type="file" accept="image/*" multiple></label>
      <p class="hint" id="photo-status" aria-live="polite">照片会保存在当前浏览器。</p>
    </section>
    <section class="panel share-panel">
      <button id="download-wish" class="download-wish" type="button">下载专属网页</button>
      <p class="hint">祝福、装扮和已加入的照片会随网页文件一起分享。</p>
      <p id="share-status" class="hint" aria-live="polite"></p>
    </section>
  </div>
</dialog>
<dialog id="album" aria-label="圣诞相册">
  <div class="photo-card" tabindex="-1" aria-label="点击照片外侧或按 Escape 关闭">
    <div id="album-empty" class="album-empty" hidden>
      <p>添加照片后，打开礼盒就能看到。</p>
      <button id="album-add" type="button">去添加照片</button>
    </div>
    <img id="large-photo" alt="" hidden>
    <div id="large-gift" class="large-gift" hidden><div class="memory-art"><div class="gift-preview"></div><strong></strong></div></div>
  </div>
</dialog>
</body>
</html>
